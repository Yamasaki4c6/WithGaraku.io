<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLSL Effect Exporter</title>
<style>
:root{
  --bg:#131418; --panel:#1b1d22; --panel2:#22252b; --line:#2e3239;
  --text:#e8e8eb; --muted:#9296a0; --accent:#f2b45c; --accent2:#7cc7ff;
  --err:#ff6b6b; --ok:#7bd88f; --sel:#2a303b; --clip:#e0567a;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Noto Sans Mono", monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:13px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(340px,36%) 1fr;height:100vh}
@media (max-width:1100px){.app{grid-template-columns:1fr;height:auto}.editor-col{height:60vh}.right-col{height:100vh}}

/* ---------- editor ---------- */
.editor-col{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;background:var(--panel)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.editing{color:var(--muted);font-size:12px;margin-left:auto;max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code-wrap{flex:1;display:flex;min-height:0;font:12.5px/1.6 var(--mono)}
.gutter{padding:10px 8px 10px 0;min-width:44px;text-align:right;color:#5b606b;background:#17191d;
  overflow:hidden;white-space:pre;user-select:none;border-right:1px solid var(--line)}
.gutter .e{color:#fff;background:var(--err);border-radius:3px;padding:0 3px}
textarea#code{flex:1;resize:none;border:0;outline:0;margin:0;padding:10px 12px;background:transparent;color:var(--text);
  font:inherit;white-space:pre;overflow:auto;tab-size:2}
textarea#code:disabled{color:var(--muted)}
.log{max-height:28%;overflow:auto;border-top:1px solid var(--line);padding:6px 10px;font:12px/1.5 var(--mono);white-space:pre-wrap;min-height:2.2em}
.log.ok{color:var(--ok)} .log.err{color:var(--err)} .log.info{color:var(--muted)}

/* ---------- right column ---------- */
.right-col{display:flex;flex-direction:column;min-height:0;min-width:0}
.stage-row{flex:1;display:flex;min-height:320px}
.preview{flex:1;min-width:0;position:relative;overflow:hidden;background:#101114}
.preview.dropping::after{content:'';position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:8px;pointer-events:none}
.stage{position:absolute;box-shadow:0 0 0 1px var(--line),0 8px 30px #0008}
.stage canvas{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.zoom-chip{position:absolute;left:10px;bottom:8px;font:11px var(--mono);color:var(--muted);background:#0009;
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;cursor:pointer}
.bg-checker-dark{background:conic-gradient(#2b2d33 25%,#3a3d44 0 50%,#2b2d33 0 75%,#3a3d44 0) 0 0/20px 20px}
.bg-checker-light{background:conic-gradient(#cfcfd4 25%,#fff 0 50%,#cfcfd4 0 75%,#fff 0) 0 0/20px 20px}

/* ---------- layers ---------- */
.layers{width:330px;flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-height:0}
.layers-head{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.layers-head b{margin-right:auto;font-weight:600}
.layers-head button{padding:2px 8px}
#layerList{list-style:none;margin:0;padding:0;overflow:auto;flex:1 1 140px;min-height:100px}
#layerList li{position:relative;display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid var(--line);cursor:pointer;
  border-left:3px solid transparent;user-select:none}
#layerList li:hover{background:#20232a}
#layerList li.sel{background:var(--sel);border-left-color:var(--accent)}
#layerList li.off .lname,#layerList li.off .thumb{opacity:.4}
#layerList li.clip .thumb{margin-left:12px}
#layerList li.clip::before{content:'';position:absolute;left:40px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--clip)}
#layerList li.drop-above{box-shadow:inset 0 2px 0 var(--accent)}
#layerList li.drop-below{box-shadow:inset 0 -2px 0 var(--accent)}
#layerList li.empty{color:var(--muted);cursor:default;font-size:12px;line-height:1.7;border:0;padding:14px 12px}
.eye{background:none;border:0;padding:2px;width:22px;height:22px;display:grid;place-items:center;color:var(--muted);flex:none}
.eye:hover{color:var(--text)}
.eye svg{width:16px;height:16px}
.thumb{width:38px;height:26px;flex:none;border-radius:4px;display:grid;place-items:center;overflow:hidden;
  background:conic-gradient(#2b2d33 25%,#3a3d44 0 50%,#2b2d33 0 75%,#3a3d44 0) 0 0/8px 8px}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb.glsl{background:#2a2333;color:#d6b4ff;font:600 9.5px var(--mono);letter-spacing:.04em}
.lname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmeta{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.errdot{width:8px;height:8px;border-radius:50%;background:var(--err);flex:none}
.layer-tools{display:flex;gap:6px;padding:6px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.layer-tools button{font-size:12px;padding:3px 8px}
.layer-tools button.on{background:var(--clip);border-color:var(--clip);color:#fff}
.layer-tools .sp{flex:1}
.props{overflow:auto;flex:0 1 auto;max-height:58%;padding:6px 10px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.props details{border:1px solid var(--line);border-radius:7px;padding:4px 8px 6px;background:#1f2126}
.props summary{cursor:pointer;color:var(--accent2);font-size:12px;padding:2px 0}
.props details > .prow{margin-top:5px}
.prow{display:flex;align-items:center;gap:6px;min-width:0}
.prow > span:first-child{color:var(--muted);width:5em;flex:none;font-size:12px}
.prow input[type=range]{min-width:40px;flex:1}
.prow input[type=number]{width:4.8em;flex:none}
.prow select{flex:1;min-width:0}
.prow.btns{flex-wrap:wrap}
.prow.btns button{font-size:12px;padding:3px 7px}
.prow label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}

/* ---------- bottom panel ---------- */
.panel{border-top:1px solid var(--line);background:var(--panel);padding:10px 12px;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row > .label{color:var(--muted);min-width:4.5em}
.group{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.group span{color:var(--muted)}
input[type=number],input[type=text],select{background:#121317;border:1px solid var(--line);border-radius:6px;padding:3px 6px;outline:0}
input[type=number]{width:5.2em}
input[type=number]:focus,input[type=text]:focus,select:focus{border-color:var(--accent)}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
input[type=color]{width:30px;height:24px;border:0;background:none;padding:0;flex:none}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:#4a4f59}
button.primary{background:var(--accent);border-color:var(--accent);color:#1b1407;font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:not-allowed}
.time{font:12px var(--mono);color:var(--muted);min-width:11em}
.hint{color:var(--muted);font-size:12px}
.progress{height:6px;background:#121317;border-radius:3px;overflow:hidden;flex:1;min-width:120px}
.progress > i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.file-label{position:relative;overflow:hidden}
.file-label input{position:absolute;inset:0;opacity:0;cursor:pointer}
</style>
</head>
<body>
<div class="app">

  <!-- ================= Editor ================= -->
  <section class="editor-col">
    <div class="bar">
      <select id="preset" title="選択中のGLSLレイヤーにサンプルを読み込みます">
        <option value="">サンプルを読み込む…</option>
      </select>
      <button id="btnCompile" title="Ctrl/⌘ + Enter">コンパイル</button>
      <label class="hint"><input type="checkbox" id="autoCompile" checked> 自動</label>
      <button id="btnSave" title=".glslとして保存">保存</button>
      <button class="file-label" title=".glsl / .frag を開く">開く<input type="file" id="fileOpen" accept=".glsl,.frag,.fs,.txt"></button>
      <span class="editing" id="editing"></span>
    </div>
    <div class="code-wrap">
      <div class="gutter" id="gutter">1</div>
      <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    </div>
    <div class="log" id="log"></div>
  </section>

  <!-- ================= Preview / Layers / Export ================= -->
  <section class="right-col">
    <div class="stage-row">
      <div class="preview" id="preview">
        <div class="stage bg-checker-dark" id="stage"><canvas id="cv"></canvas></div>
        <canvas id="overlay"></canvas>
        <div class="zoom-chip" id="zoomChip" title="クリックで全体表示（Ctrl/⌘+0）">100%</div>
      </div>

      <aside class="layers">
        <div class="layers-head">
          <b>レイヤー</b>
          <button id="addShader" title="GLSLレイヤーを追加">＋GLSL</button>
          <button class="file-label" title="画像レイヤーを追加（ドロップ・貼り付けでも可）">＋画像<input type="file" id="addImage" accept="image/*" multiple></button>
        </div>
        <ul id="layerList"></ul>
        <div class="layer-tools">
          <button id="clipBtn" title="下のレイヤーでクリッピング（Ctrl/⌘+Alt+G）">クリッピング</button>
          <span class="sp"></span>
          <button id="undoBtn" title="取り消し（Ctrl/⌘+Z）">↶</button>
          <button id="redoBtn" title="やり直し（Ctrl/⌘+Shift+Z）">↷</button>
          <button id="dupLayer" title="複製">複製</button>
          <button id="delLayer" title="削除（Delete）">削除</button>
        </div>
        <div class="props" id="props" hidden>
          <div class="prow"><span>不透明度</span>
            <input type="range" id="pOpacity" min="0" max="100" step="1">
            <input type="number" id="pOpacityN" min="0" max="100" step="1"></div>
          <div class="prow"><span>合成モード</span><select id="pBlend"></select></div>
          <div class="prow" data-for="shader"><span>アルファ</span>
            <select id="pAlpha">
              <option value="0">straight — vec4(col, a)</option>
              <option value="1">premultiplied — vec4(col*a, a)</option>
            </select></div>

          <details open data-for="image">
            <summary>変形</summary>
            <div class="prow"><span>中心 px</span>
              X<input type="number" id="pCX" step="1"> Y<input type="number" id="pCY" step="1"></div>
            <div class="prow"><span>拡大 %</span>
              幅<input type="number" id="pSW" step="1"> 高<input type="number" id="pSH" step="1">
              <label title="縦横比を固定（ドラッグ中は Shift で一時的に切り替え）"><input type="checkbox" id="pLock" checked>固定</label></div>
            <div class="prow"><span>回転 °</span>
              <input type="range" id="pRot" min="-180" max="180" step="1">
              <input type="number" id="pRotN" step="0.1"></div>
            <div class="prow btns">
              <button id="pFlipH">左右反転</button>
              <button id="pFlipV">上下反転</button>
              <button id="pReset" title="等倍・中央・回転なし">リセット</button>
            </div>
            <div class="prow btns">
              <button id="pFitCanvas">キャンバスに合わせる</button>
              <button id="pFitOut" title="出力解像度をこの画像と同じにします">出力サイズを画像に</button>
            </div>
            <div class="prow"><span>補間</span>
              <select id="pInterp">
                <option value="smooth">なめらか</option>
                <option value="nearest">ニアレストネイバー（ドット絵向け）</option>
              </select></div>
          </details>

          <details id="fxBox">
            <summary>加工</summary>
            <div class="prow"><span>抜き</span>
              <select id="fxKey">
                <option value="none">なし</option>
                <option value="white">白抜き（白を透明に）</option>
                <option value="black">黒抜き（黒を透明に）</option>
              </select></div>
            <div class="prow"><span>レイヤーカラー</span>
              <label><input type="checkbox" id="fxColorOn">単色にする</label>
              <input type="color" id="fxColor" value="#3a6df0"></div>
            <div id="fxSliders"></div>
            <div class="prow"><span>反転</span><label><input type="checkbox" id="fxInvert">色を反転</label></div>
            <div class="prow"><span>フチの色</span><input type="color" id="fxOutlineColor" value="#ffffff"></div>
            <div class="prow btns"><button id="fxReset">加工をリセット</button></div>
          </details>
        </div>
      </aside>
    </div>

    <div class="panel">
      <div class="row">
        <button id="btnPlay" style="min-width:4.5em">一時停止</button>
        <input type="range" id="scrub" min="0" max="2" step="0.001" value="0">
        <span class="time" id="timeText">0.000s / f0</span>
        <label class="hint"><input type="checkbox" id="loop" checked> ループ</label>
      </div>
      <div class="row">
        <span class="label">プレビュー</span>
        <div class="group"><span>背景</span>
          <select id="bgMode">
            <option value="checker-dark">市松（暗）</option>
            <option value="checker-light">市松（明）</option>
            <option value="black">黒</option>
            <option value="white">白</option>
            <option value="color">単色</option>
          </select>
          <input type="color" id="bgColor" value="#6b7a99" hidden>
        </div>
        <div class="group"><span>表示解像度</span>
          <select id="pscale">
            <option value="1">100%</option>
            <option value="0.5" selected>50%</option>
            <option value="0.25">25%</option>
          </select>
        </div>
      </div>
      <div class="row">
        <span class="label">出力</span>
        <div class="group"><span>W</span><input type="number" id="w" value="1920" min="1" max="8192">
          <span>H</span><input type="number" id="h" value="1080" min="1" max="8192"></div>
        <div class="group"><span>fps</span><input type="number" id="fps" value="30" min="1" max="240"></div>
        <div class="group"><span>長さ(秒)</span><input type="number" id="dur" value="2" min="0.01" step="0.1"></div>
        <div class="group"><span>開始</span><input type="number" id="start" value="0" step="0.1"></div>
        <label class="group" title="アルファを捨て、黒背景に合成した不透明PNGを書き出します（加算・スクリーン用）">
          <input type="checkbox" id="blackBg"> 黒背景
        </label>
        <div class="group"><span>ファイル名</span><input type="text" id="prefix" value="frame_" style="width:7em"></div>
        <span class="hint" id="frameInfo"></span>
      </div>
      <div class="row">
        <button id="btnStill">現在のフレームをPNG</button>
        <button class="primary" id="btnZip">連番をZIPで書き出し</button>
        <button id="btnDir" title="Chrome / Edge のみ">連番をフォルダへ書き出し</button>
        <button id="btnCancel" hidden>中止</button>
        <div class="progress"><i id="bar"></i></div>
        <span class="hint" id="status"></span>
      </div>
    </div>
  </section>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);

/* ================================================================
   Presets
   ================================================================ */
const PRESETS = [
{
  name: '衝撃波リング', alphaMode: 0, blend: 'normal',
  code: `// 衝撃波リング — straight アルファ: fragColor = vec4(色, 不透明度)
// iDuration（長さ）で1回広がって消えます

void mainImage(out vec4 fragColor, in vec2 fragCoord)
{
    vec2 uv = (fragCoord - 0.5 * iResolution.xy) / iResolution.y;
    float t = fract(iTime / iDuration);          // 0→1 を繰り返す

    float ang = atan(uv.y, uv.x);
    float r = length(uv);
    float radius = mix(0.02, 0.48, 1.0 - pow(1.0 - t, 3.0));
    radius += 0.008 * sin(ang * 14.0 + t * 20.0); // 縁のゆらぎ

    float width = mix(0.01, 0.06, t);
    float ring = smoothstep(width, 0.0, abs(r - radius));
    float inner = smoothstep(radius, 0.0, r) * 0.15; // 内側のうっすらした面
    float fade = pow(1.0 - t, 1.5);

    vec3 col = mix(vec3(0.55, 0.85, 1.0), vec3(1.0), ring);
    float a = clamp((ring + inner) * fade, 0.0, 1.0);

    fragColor = vec4(col, a);
}
`},
{
  name: '光の粒', alphaMode: 1, blend: 'addglow',
  code: `// 光の粒 — 光を足し算で重ねるので premultiplied で書いています
// レイヤーの合成を「加算（発光）」にすると下の絵を明るく照らします

float hash(float n) { return fract(sin(n) * 43758.5453); }

void mainImage(out vec4 fragColor, in vec2 fragCoord)
{
    vec2 uv = (fragCoord - 0.5 * iResolution.xy) / iResolution.y;
    float aspect = iResolution.x / iResolution.y;
    float loopT = iTime / iDuration;               // 整数倍で動かすとループが繋がる

    vec3 col = vec3(0.0);
    for (int i = 0; i < 70; i++) {
        float fi = float(i);
        float cycles = 1.0 + floor(hash(fi * 3.7) * 2.0);
        float y = fract(hash(fi * 1.3) + loopT * cycles);
        float phase = 6.2831853 * (loopT * cycles + hash(fi * 2.9));
        vec2 p = vec2((hash(fi * 5.1) - 0.5) * aspect + 0.03 * sin(phase),
                      mix(-0.6, 0.6, y));

        float d = length(uv - p);
        float size = mix(0.00008, 0.0004, hash(fi * 8.3));
        float g = size / (d * d + size) * smoothstep(0.12, 0.0, d);
        float twinkle = 0.55 + 0.45 * sin(phase * 3.0 + fi);
        float fade = smoothstep(0.0, 0.15, y) * smoothstep(1.0, 0.7, y);

        vec3 tint = mix(vec3(1.0, 0.72, 0.32), vec3(0.55, 0.85, 1.0), hash(fi * 9.3));
        col += tint * g * twinkle * fade;
    }

    float a = clamp(max(col.r, max(col.g, col.b)), 0.0, 1.0);
    fragColor = vec4(col, a);   // premultiplied: 色にはすでにアルファ分が含まれている
}
`},
{
  name: '墨・煙', alphaMode: 0, blend: 'normal',
  code: `// 墨・煙 — 不透明感のあるものは straight アルファで
// ノイズ空間を円周上で動かしてループさせています

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float noise(vec2 p)
{
    vec2 i = floor(p), f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i),                 hash(i + vec2(1.0, 0.0)), u.x),
               mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}

float fbm(vec2 p)
{
    float v = 0.0, amp = 0.5;
    for (int i = 0; i < 5; i++) {
        v += amp * noise(p);
        p = p * 2.03 + vec2(1.7, 9.2);
        amp *= 0.5;
    }
    return v;
}

void mainImage(out vec4 fragColor, in vec2 fragCoord)
{
    vec2 uv = (fragCoord - 0.5 * iResolution.xy) / iResolution.y;
    float ph = 6.2831853 * iTime / iDuration;
    vec2 flow = vec2(cos(ph), sin(ph)) * 0.7;

    vec2 q = uv * 2.8;
    vec2 w = vec2(fbm(q + flow), fbm(q + flow + vec2(5.2, 1.3)));
    float n = fbm(q + 1.6 * w + 0.5 * flow);

    float shape = smoothstep(0.6, 0.1, length(uv * vec2(0.9, 1.2)));
    float density = smoothstep(0.3, 0.55, n * (0.6 + 0.6 * shape)) * shape;

    vec3 ink = mix(vec3(0.04, 0.035, 0.07), vec3(0.32, 0.22, 0.48), smoothstep(0.5, 0.9, n));
    fragColor = vec4(ink, clamp(density * 0.95, 0.0, 1.0));
}
`},
{
  name: '陽炎（下を歪ませる）', alphaMode: 0, blend: 'replace',
  code: `// 陽炎 — iChannel0 はこのレイヤーより下の合成結果
// 合成を「置き換え」にすると、下のレイヤーが歪んだ状態に置き換わります
// クリッピングしたときは、クリッピング先（とその上）が iChannel0 になります

void mainImage(out vec4 fragColor, in vec2 fragCoord)
{
    vec2 uv = fragCoord / iResolution.xy;
    float ph = 6.2831853 * iTime / iDuration;

    // 上にいくほど強く揺らぐ
    float strength = 0.006 * smoothstep(0.1, 0.9, uv.y);
    vec2 offs = vec2(sin(uv.y * 45.0 - ph * 2.0),
                     cos(uv.x * 30.0 + ph * 3.0)) * strength;

    fragColor = texture(iChannel0, uv + offs);
}
`}
];

const NEW_SHADER_CODE = `// iChannel0 = このレイヤーより下の合成結果

void mainImage(out vec4 fragColor, in vec2 fragCoord)
{

    cx: opts.cx ?? 0, cy: opts.cy ?? 0, sx: opts.sx ?? 1, sy: opts.sy ?? 1, rot: opts.rot ?? 0,
    flipH: !!opts.flipH, flipV: !!opts.flipV, interp: opts.interp || 'smooth',
    blob: opts.blob, url: null, tex: null, iw: 1, ih: 1,
  };
}
const layerReady = l => l.type === 'image' ? !!l.tex : !!l.prog;

function insertLayer(l) {
  checkpoint();
  const cur = sel();
  const i = cur ? layers.indexOf(cur) + 1 : layers.length;
  // クリッピング中のレイヤーの上に入れたときは、新しいレイヤーもクリッピングを引き継がない
  layers.splice(i, 0, l);
  selectLayer(l.id);
  dirty = true;
  scheduleSave();
}
function removeLayer(l) {
  const i = layers.indexOf(l);
  if (i < 0) return;
  checkpoint();
  layers.splice(i, 1);
  l._removed = true;       // 取り消しで戻せるようにテクスチャは残す
  const next = layers[Math.min(i, layers.length - 1)] || null;
  selectLayer(next ? next.id : null);
  dirty = true;
  scheduleSave();
}
async function duplicateLayer(l) {
  if (!l) return;
  const { id, ...rest } = l;
  let c;
  if (l.type === 'shader') {
    c = makeShaderLayer({ ...rest, name: l.name + ' コピー' });
    compileLayer(c);
  } else {
    c = makeImageLayer({ ...rest, name: l.name + ' コピー' });
    await loadImageLayer(c);
    idb.put(c.id, c.blob).catch(() => {});
  }
  insertLayer(c);
}
function moveLayer(dragId, targetId, above) {
  const d = byId(dragId);
  if (!d || dragId === targetId) return;
  checkpoint();
  layers.splice(layers.indexOf(d), 1);
  const t = layers.indexOf(byId(targetId));
  layers.splice(above ? t + 1 : t, 0, d);
  renderLayerList();
  dirty = true;
  scheduleSave();
}
function toggleClip() {
  const l = sel();
  if (!l) return;
  checkpoint();
  l.clip = !l.clip;
  renderLayerList();
  refreshProps();
  dirty = true;
  scheduleSave();
}

/* ---------- image layers ---------- */
function applyInterp(l) {
  if (!l.tex) return;
  gl.bindTexture(gl.TEXTURE_2D, l.tex);
  const near = l.interp === 'nearest';
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, near ? gl.NEAREST : gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, near ? gl.NEAREST : gl.LINEAR);
}
async function loadImageLayer(l) {
  const url = URL.createObjectURL(l.blob);
  const img = new Image();
  img.src = url;
  await img.decode();
  l.iw = img.naturalWidth;
  l.ih = img.naturalHeight;
  let src = img;
  const max = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  if (l.iw > max || l.ih > max) {
    const k = max / Math.max(l.iw, l.ih);
    const c = document.createElement('canvas');
    c.width = Math.floor(l.iw * k); c.height = Math.floor(l.ih * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    src = c;
  }
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  l.tex = tex;
  l.url = url;
  applyInterp(l);
}
async function addImageFiles(files) {
  const imgs = [...files].filter(f => f.type.startsWith('image/'));
  const s = S();
  for (const f of imgs) {
    const l = makeImageLayer({ name: f.name || '貼り付け画像', blob: f });
    try { await loadImageLayer(l); }
    catch (e) { setStatus(`${f.name} を読み込めませんでした`); continue; }
    const k = Math.min(1, s.w / l.iw, s.h / l.ih);   // キャンバスより大きければ収める
    Object.assign(l, { cx: s.w / 2, cy: s.h / 2, sx: k, sy: k });
    insertLayer(l);
    idb.put(l.id, f).catch(() => {});
  }
}

/* ---------- image transform math（出力px・左上原点・y下向き） ---------- */
function tf(l) {
  const t = l.rot * Math.PI / 180;
  return { c: Math.cos(t), s: Math.sin(t), ssx: l.sx * (l.flipH ? -1 : 1), ssy: l.sy * (l.flipV ? -1 : 1) };
}
function localToOut(l, Lx, Ly) {
  const { c, s, ssx, ssy } = tf(l);
  const x = (Lx - l.iw / 2) * ssx, y = (Ly - l.ih / 2) * ssy;
  return [l.cx + c * x - s * y, l.cy + s * x + c * y];
}
function outToLocal(l, ox, oy) {
  const { c, s, ssx, ssy } = tf(l);
  const vx = ox - l.cx, vy = oy - l.cy;
  return [l.iw / 2 + (c * vx + s * vy) / ssx, l.ih / 2 + (-s * vx + c * vy) / ssy];
}
function imageInvMatrix(l, ps) {
  const { c, s, ssx, ssy } = tf(l);
  return new Float32Array([
    c / (ps * ssx), -s / (ps * ssy), 0,
    s / (ps * ssx), c / (ps * ssy), 0,
    l.iw / 2 - (c * l.cx + s * l.cy) / ssx, l.ih / 2 - (-s * l.cx + c * l.cy) / ssy, 1,
  ]);
}

/* ---------- shader layers ---------- */
function compileLayer(l) {
  const src = l.code.replace(/^[ \t]*#version.*$/gm, '');
  const userLines = src.split('\n').length;
  const r = buildProgram(USER_HEAD + src + USER_TAIL);
  if (r.error) {
    const { text, lines } = parseErrors(r.error, userLines);
    l.error = text;
    l.errorLines = lines;
  } else {
    if (l.prog) gl.deleteProgram(l.prog);
    l.prog = r.prog;
    l.U = {};
    for (const n of USER_UNIFORMS) l.U[n] = gl.getUniformLocation(r.prog, n);
    l.error = null;
    l.errorLines = new Set();
  }
  if (l.id === selId) { updateGutter(); showLayerLog(); }
  renderLayerList();
  dirty = true;
  return !l.error;
}
function parseErrors(info, userLines) {
  const lines = new Set(), out = [];
  for (const raw of info.split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    const m = line.match(/^(?:ERROR|WARNING):\s*\d+:(\d+):\s*(.*)$/);
    if (m) {
      const ln = +m[1];
      if (ln >= 1 && ln <= userLines) { lines.add(ln); out.push(`${ln}行目: ${m[2]}`); }
      else out.push(`(末尾) ${m[2]}　← mainImage が無い・括弧の閉じ忘れなど`);
    } else out.push(line);
  }
  return { text: out.join('\n'), lines };
}

/* ================================================================
   Undo / Redo（レイヤー構成・プロパティ・変形・加工。コード編集はエディタ側の取り消し）
   ================================================================ */
const PROP_KEYS = ['name','visible','opacity','blend','clip','alphaMode','cx','cy','sx','sy','rot','flipH','flipV','interp'];
const hist = { undo: [], redo: [], key: null, time: 0 };
function snapshot() {
  return {
    selId,
    items: layers.map(l => {
      const p = {};
      for (const k of PROP_KEYS) if (k in l) p[k] = l[k];
      p.fx = { ...l.fx };
      return { l, p };
    }),
  };
}
function checkpoint(key) {
  if (booting) return;
  const now = performance.now();
  if (key && key === hist.key && now - hist.time < 1200) { hist.time = now; return; }
  hist.undo.push(snapshot());
  if (hist.undo.length > 120) hist.undo.shift();
  hist.redo = [];
  hist.key = key || null;
  hist.time = now;
  updateUndoButtons();
}
function restoreSnapshot(snap) {
  layers = snap.items.map(({ l, p }) => {
    Object.assign(l, p, { fx: { ...p.fx } });
    if (l.type === 'image') applyInterp(l);
    if (l._removed) { l._removed = false; if (l.type === 'image') idb.put(l.id, l.blob).catch(() => {}); }
    return l;
  });
  selectLayer(byId(snap.selId) ? snap.selId : (layers.at(-1)?.id ?? null));
  dirty = true;
  scheduleSave();
}
function undo() {
  if (!hist.undo.length) return;
  hist.redo.push(snapshot());
  restoreSnapshot(hist.undo.pop());
  hist.key = null;
  updateUndoButtons();
}
function redo() {
  if (!hist.redo.length) return;
  hist.undo.push(snapshot());
  restoreSnapshot(hist.redo.pop());
  hist.key = null;
  updateUndoButtons();
}
function updateUndoButtons() {
  $('#undoBtn').disabled = !hist.undo.length;
  $('#redoBtn').disabled = !hist.redo.length;
}
$('#undoBtn').addEventListener('click', undo);
$('#redoBtn').addEventListener('click', redo);

const EYE_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M10.6 5.1A10.6 10.6 0 0 1 12 5c7 0 11 7 11 7a18 18 0 0 1-3.2 4M6.6 6.6C3 8.6 1 12 1 12s4 7 11 7a10 10 0 0 0 5.4-1.6"/></svg>';

function renderLayerList() {
  const ul = $('#layerList');
  ul.innerHTML = '';
  if (!layers.length) {
    ul.innerHTML = '<li class="empty">レイヤーがありません。<br>＋GLSL／＋画像 で追加できます。<br>画像はプレビューへのドロップや<br>Ctrl/⌘+V の貼り付けでも追加できます。</li>';
    return;
  }
  for (let i = layers.length - 1; i >= 0; i--) {
    const l = layers[i];
    const li = document.createElement('li');
    li.draggable = true;
    if (l.id === selId) li.classList.add('sel');
    if (!l.visible) li.classList.add('off');
    if (l.clip && i > 0) li.classList.add('clip');

    const eye = document.createElement('button');
    eye.className = 'eye';
    eye.title = '表示／非表示';
    eye.innerHTML = l.visible ? EYE_ON : EYE_OFF;
    eye.addEventListener('click', e => {
      e.stopPropagation();
      checkpoint();
      l.visible = !l.visible;
      renderLayerList();
      dirty = true;
      scheduleSave();
    });

    const thumb = document.createElement('div');
    if (l.type === 'image') {
      thumb.className = 'thumb';
      const im = document.createElement('img');
      im.src = l.url;
      im.draggable = false;
      thumb.appendChild(im);
    } else {
      thumb.className = 'thumb glsl';
      thumb.textContent = 'GLSL';
    }

    const nameBox = document.createElement('div');
    nameBox.style.cssText = 'flex:1;min-width:0';
    const name = document.createElement('div');
    name.className = 'lname';
    name.textContent = l.name;
    name.title = 'ダブルクリックで名前を変更';
    const meta = document.createElement('div');
    meta.className = 'lmeta';
    const bits = [];
    if (l.blend !== 'normal') bits.push(BLEND_LABEL[l.blend]);
    if (l.opacity < 1) bits.push(Math.round(l.opacity * 100) + '%');
    if (fxActive(l.fx)) bits.push('加工');
    meta.textContent = bits.join(' · ');
    nameBox.append(name, meta);

    li.append(eye, thumb, nameBox);
    if (l.type === 'shader' && l.error) {
      const d = document.createElement('span');
      d.className = 'errdot';
      d.title = 'コンパイルエラー';
      li.appendChild(d);
    }

    li.addEventListener('click', () => selectLayer(l.id));
    li.addEventListener('dblclick', () => {
      const n = prompt('レイヤー名', l.name);
      if (n && n.trim()) { checkpoint(); l.name = n.trim(); renderLayerList(); updateEditingLabel(); scheduleSave(); }
    });
    li.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/x-layer', l.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    li.addEventListener('dragover', e => {
      if (!e.dataTransfer.types.includes('text/x-layer')) return;
      e.preventDefault();
      const r = li.getBoundingClientRect();
      const above = e.clientY < r.top + r.height / 2;
      li.classList.toggle('drop-above', above);
      li.classList.toggle('drop-below', !above);
    });
    li.addEventListener('dragleave', () => li.classList.remove('drop-above', 'drop-below'));
    li.addEventListener('drop', e => {
      const id = e.dataTransfer.getData('text/x-layer');
      if (!id) return;
      e.preventDefault();
      e.stopPropagation();
      const above = li.classList.contains('drop-above');
      li.classList.remove('drop-above', 'drop-below');
      moveLayer(id, l.id, above);
    });
    ul.appendChild(li);
  }
}

/* ---------- properties ---------- */
const fxInputs = {};
(() => {
  const box = $('#fxSliders');
  for (const [k, label, min, max] of FX_SLIDERS) {
    const row = document.createElement('div');
    row.className = 'prow';
    row.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="1"><input type="number" min="${min}" max="${max}" step="1">`;
    const [r, n] = row.querySelectorAll('input');
    fxInputs[k] = { r, n };
    r.addEventListener('input', () => { n.value = r.value; setFx(k, +r.value); });
    n.addEventListener('change', () => { const v = Math.min(max, Math.max(min, +n.value || 0)); r.value = n.value = v; setFx(k, v); });
    box.appendChild(row);
  }
})();

}

function propChanged() { dirty = true; renderLayerList(); refreshProps(); scheduleSave(); }
const withImage = fn => () => { const l = sel(); if (l && l.type === 'image') fn(l); };

function showLayerLog() {

const num = (id, def, min, max) => {
  let v = parseFloat($(id).value);
  if (!isFinite(v)) v = def;
  return Math.min(max, Math.max(min, v));
};
function S() {
  return {
    w: Math.round(num('#w', 1920, 1, 8192)),
    h: Math.round(num('#h', 1080, 1, 8192)),
    fps: num('#fps', 30, 1, 240),
    dur: num('#dur', 2, 0.01, 3600),
    start: num('#start', 0, -1e6, 1e6),
    prefix: ($('#prefix').value || 'frame_').replace(/[\\/:*?"<>|]/g, '_'),
    blackBg: $('#blackBg').checked,
    pscale: +$('#pscale').value,
  };
}
const frameCountOf = s => Math.max(1, Math.round(s.dur * s.fps));

function applyResolution(scale) {
  const s = S();
  const sc = scale ?? s.pscale;
  canvas.width = Math.max(1, Math.round(s.w * sc));
  canvas.height = Math.max(1, Math.round(s.h * sc));
  dirty = true;
}

// 表示（クリスタの表示倍率・スクロールに相当）
const view = { zoom: 1, panX: 0, panY: 0, k: 1, k0: 1, left: 0, top: 0 };
const overlay = $('#overlay');
const octx = overlay.getContext('2d');
function fitStage() {
  const s = S();
  const pw = previewEl.clientWidth, ph = previewEl.clientHeight;
  view.k0 = Math.max(0.001, Math.min((pw - 40) / s.w, (ph - 40) / s.h));
  view.k = view.k0 * view.zoom;
  const w = s.w * view.k, h = s.h * view.k;
  view.left = (pw - w) / 2 + view.panX;
  view.top = (ph - h) / 2 + view.panY;
  const st = $('#stage').style;
  st.left = view.left + 'px'; st.top = view.top + 'px';
  st.width = w + 'px'; st.height = h + 'px';
  const dpr = window.devicePixelRatio || 1;
  if (overlay.width !== Math.round(pw * dpr) || overlay.height !== Math.round(ph * dpr)) {
    overlay.width = Math.round(pw * dpr);
    overlay.height = Math.round(ph * dpr);
  }
  $('#zoomChip').textContent = Math.round(view.k * 100) + '%';
}
function zoomAt(factor, mx, my) {
  const s = S();
  const pw = previewEl.clientWidth, ph = previewEl.clientHeight;
  if (mx === undefined) { mx = pw / 2; my = ph / 2; }
  const ox = (mx - view.left) / view.k, oy = (my - view.top) / view.k;
  const k = Math.min(32, Math.max(0.02, view.k * factor));
  view.zoom = k / view.k0;
  view.panX = (mx - ox * k) - (pw - s.w * k) / 2;
  view.panY = (my - oy * k) - (ph - s.h * k) / 2;
  fitStage();
}
function fitView() { view.zoom = 1; view.panX = 0; view.panY = 0; fitStage(); }
function actualPixels() { view.zoom = 1 / view.k0; view.panX = 0; view.panY = 0; fitStage(); }
$('#zoomChip').addEventListener('click', fitView);

function updateFrameInfo() {

  $('#frameInfo').textContent = `${n}フレーム`;
  $('#frameInfo').title = `${s.start.toFixed(2)}s 〜 ${(s.start + (n - 1) / s.fps).toFixed(2)}s`;
  $('#scrub').max = s.dur;
  $('#scrub').step = 1 / s.fps;
}

}
['#w','#h','#fps','#dur','#start','#prefix','#blackBg','#pscale'].forEach(id =>

/* ================================================================
   変形ツール（オーバーレイ上の操作）
   ================================================================ */
const HANDLES = [
  ['nw', 0, 0], ['n', 0.5, 0], ['ne', 1, 0], ['e', 1, 0.5],
  ['se', 1, 1], ['s', 0.5, 1], ['sw', 0, 1], ['w', 0, 0.5],
];
const ROT_CURSOR = `url("data:image/svg+xml,${encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2-5" fill="none" stroke="#000" stroke-width="4"/><path d="M5 12a7 7 0 1 0 2-5" fill="none" stroke="#fff" stroke-width="2"/><path d="M3 3v6h6z" fill="#fff" stroke="#000"/></svg>')}") 12 12, auto`;

const mouse = { x: 0, y: 0, cx: 0, cy: 0, down: false };
let op = null, spaceDown = false, hoverInfo = null;

const toScreen = (ox, oy) => [view.left + ox * view.k, view.top + oy * view.k];
const toOut = (mx, my) => [(mx - view.left) / view.k, (my - view.top) / view.k];
function localPoint(e) {
  const r = previewEl.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

function hitTest(l, mx, my) {
  for (const [id, hx, hy] of HANDLES) {
    const [sx, sy] = toScreen(...localToOut(l, hx * l.iw, hy * l.ih));
    if (Math.hypot(mx - sx, my - sy) <= 9) return { type: 'handle', id, hx, hy };
  }
  const [Lx, Ly] = outToLocal(l, ...toOut(mx, my));
  if (Lx >= 0 && Ly >= 0 && Lx <= l.iw && Ly <= l.ih) return { type: 'inside' };
  return { type: 'outside' };
}
function resizeCursor(l, hx, hy) {
  const [cx, cy] = toScreen(l.cx, l.cy);
  const [sx, sy] = toScreen(...localToOut(l, hx * l.iw, hy * l.ih));
  const a = ((Math.atan2(sy - cy, sx - cx) * 180 / Math.PI) % 180 + 180) % 180;
  return a < 22.5 || a >= 157.5 ? 'ew-resize' : a < 67.5 ? 'nwse-resize' : a < 112.5 ? 'ns-resize' : 'nesw-resize';
}
function updateCursor(mx, my) {
  if (op) return;
  if (spaceDown) { overlay.style.cursor = 'grab'; return; }
  const l = sel();
  if (!l || l.type !== 'image' || !l.visible || mx === undefined) {
    overlay.style.cursor = l && l.type === 'image' ? 'default' : 'crosshair';
    return;
  }
  const h = hitTest(l, mx, my);
  hoverInfo = h;
  overlay.style.cursor = h.type === 'handle' ? resizeCursor(l, h.hx, h.hy) : h.type === 'inside' ? 'move' : ROT_CURSOR;
}

function pickImageAt(mx, my) {
  const [ox, oy] = toOut(mx, my);
  for (let i = layers.length - 1; i >= 0; i--) {
    const l = layers[i];
    if (l.type !== 'image' || !l.visible) continue;
    const [Lx, Ly] = outToLocal(l, ox, oy);
    if (Lx >= 0 && Ly >= 0 && Lx <= l.iw && Ly <= l.ih) { selectLayer(l.id); return true; }
  }
  return false;
}

overlay.addEventListener('pointerdown', e => {
  const [mx, my] = localPoint(e);
  if (e.button === 1 || (e.button === 0 && spaceDown)) {
    e.preventDefault();
    overlay.setPointerCapture(e.pointerId);
    op = { type: 'pan', sx: e.clientX, sy: e.clientY, px: view.panX, py: view.panY };
    overlay.style.cursor = 'grabbing';
    return;
  }
  if (e.button !== 0) return;
  if (e.ctrlKey || e.metaKey) { pickImageAt(mx, my); return; }
  overlay.setPointerCapture(e.pointerId);
  const l = sel();
  if (l && l.type === 'image' && l.visible) {
    const [ox, oy] = toOut(mx, my);
    const h = hitTest(l, mx, my);
    checkpoint();
    const base = { l, ox, oy, cx: l.cx, cy: l.cy, rot: l.rot, ...tf(l) };
    if (h.type === 'handle') {
      op = { ...base, type: 'scale', hx: h.hx, hy: h.hy, ssx0: base.ssx, ssy0: base.ssy };
    } else if (h.type === 'inside') {
      op = { ...base, type: 'move' };
    } else {
      op = { ...base, type: 'rotate', a0: Math.atan2(oy - l.cy, ox - l.cx) };
    }
    return;
  }
  // GLSL レイヤー選択中は iMouse
  const [ox, oy] = toOut(mx, my);
  const s = S();
  mouse.x = mouse.cx = ox / s.w;
  mouse.y = mouse.cy = 1 - oy / s.h;
  mouse.down = true;
  dirty = true;
});

overlay.addEventListener('pointermove', e => {
  const [mx, my] = localPoint(e);
  if (!op) {
    if (mouse.down) {
      const [ox, oy] = toOut(mx, my);
      const s = S();
      mouse.x = ox / s.w; mouse.y = 1 - oy / s.h;
      dirty = true;
    }
    updateCursor(mx, my);
    return;
  }
  if (op.type === 'pan') {
    view.panX = op.px + (e.clientX - op.sx);
    view.panY = op.py + (e.clientY - op.sy);
    fitStage();
    return;
  }
  const l = op.l;
  const [ox, oy] = toOut(mx, my);
  if (op.type === 'move') {
    let dx = ox - op.ox, dy = oy - op.oy;
    if (e.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) dy = 0; else dx = 0; }
    l.cx = op.cx + dx;
    l.cy = op.cy + dy;
  } else if (op.type === 'rotate') {
    let r = op.rot + (Math.atan2(oy - op.cy, ox - op.cx) - op.a0) * 180 / Math.PI;
    if (e.shiftKey) r = Math.round(r / 15) * 15;
    l.rot = r;
  } else if (op.type === 'scale') {
    applyScaleDrag(op, ox, oy, e.shiftKey, e.altKey);
  }
  refreshImageProps(l);
  dirty = true;
});

function applyScaleDrag(o, ox, oy, shift, alt) {
  const l = o.l;
  const { c, s, ssx0, ssy0, hx, hy } = o;
  // 中心基準のローカル座標（画像px）
  const h = [(hx - 0.5) * l.iw, (hy - 0.5) * l.ih];
  const A = alt ? [0, 0] : [-h[0], -h[1]];
  // ドラッグ開始時のアンカー位置（出力px）
  const ax0 = A[0] * ssx0, ay0 = A[1] * ssy0;
  const PA = [o.cx + c * ax0 - s * ay0, o.cy + s * ax0 + c * ay0];
  const vx = ox - PA[0], vy = oy - PA[1];
  const d = [c * vx + s * vy, -s * vx + c * vy];          // 回転を戻した移動量
  const lock = $('#pLock').checked !== shift;
  const fix = v => (Math.abs(v) < 1e-3 ? (v < 0 ? -1e-3 : 1e-3) : v);
  const ex = h[0] - A[0], ey = h[1] - A[1];
  let ssx = ssx0, ssy = ssy0;
  const corner = ex !== 0 && ey !== 0;
  if (corner && lock) {
    const hv = [ex * ssx0, ey * ssy0];
    const f = Math.max(0.01, (d[0] * hv[0] + d[1] * hv[1]) / (hv[0] * hv[0] + hv[1] * hv[1]));
    ssx = ssx0 * f; ssy = ssy0 * f;
  } else if (corner) {
    ssx = fix(d[0] / ex); ssy = fix(d[1] / ey);
  } else if (ex !== 0) {
    ssx = fix(d[0] / ex);
    if (lock) { const f = Math.abs(ssx / ssx0); ssy = ssy0 * f; }
  } else {
    ssy = fix(d[1] / ey);
    if (lock) { const f = Math.abs(ssy / ssy0); ssx = ssx0 * f; }
  }
  l.sx = Math.abs(ssx); l.flipH = ssx < 0;
  l.sy = Math.abs(ssy); l.flipV = ssy < 0;
  // アンカーが動かないように中心を補正
  const ax = A[0] * ssx, ay = A[1] * ssy;
  l.cx = PA[0] - (c * ax - s * ay);
  l.cy = PA[1] - (s * ax + c * ay);
}

function endPointer() {
  if (op) {
    if (op.type !== 'pan') { refreshProps(); scheduleSave(); }
    op = null;
  }
  mouse.down = false;
  dirty = true;
  updateCursor();
}
overlay.addEventListener('pointerup', endPointer);
overlay.addEventListener('pointercancel', endPointer);
overlay.addEventListener('auxclick', e => e.preventDefault());

overlay.addEventListener('wheel', e => {
  e.preventDefault();
  const [mx, my] = localPoint(e);
  const delta = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
  zoomAt(Math.exp(-delta * 0.0018), mx, my);
}, { passive: false });

function drawOverlay() {
  const dpr = window.devicePixelRatio || 1;
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.clearRect(0, 0, overlay.width, overlay.height);
  const l = sel();
  if (!l || l.type !== 'image' || !l.tex) return;
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pts = [[0, 0], [1, 0], [1, 1], [0, 1]].map(([u, v]) => toScreen(...localToOut(l, u * l.iw, v * l.ih)));
  octx.beginPath();
  pts.forEach(([x, y], i) => (i ? octx.lineTo(x, y) : octx.moveTo(x, y)));
  octx.closePath();
  octx.lineWidth = 3; octx.strokeStyle = 'rgba(0,0,0,.55)'; octx.stroke();

  octx.setLineDash([]);
  if (!l.visible) return;
  for (const [, hx, hy] of HANDLES) {
    const [x, y] = toScreen(...localToOut(l, hx * l.iw, hy * l.ih));
    octx.fillStyle = '#fff'; octx.strokeStyle = '#000'; octx.lineWidth = 1;
    octx.fillRect(x - 4, y - 4, 8, 8); octx.strokeRect(x - 4.5, y - 4.5, 9, 9);

  octx.beginPath(); octx.moveTo(cx - 6, cy); octx.lineTo(cx + 6, cy); octx.moveTo(cx, cy - 6); octx.lineTo(cx, cy + 6); octx.stroke();

    const txt = op.type === 'rotate' ? `${l.rot.toFixed(1)}°` : `${(l.sx * 100).toFixed(1)}% × ${(l.sy * 100).toFixed(1)}%`;
    octx.font = '12px ui-monospace, monospace';
    const w = octx.measureText(txt).width + 10;
    octx.fillStyle = 'rgba(0,0,0,.7)'; octx.fillRect(cx + 10, cy + 10, w, 20);
    octx.fillStyle = '#fff'; octx.fillText(txt, cx + 15, cy + 24);
  }
}

/* ---------- keyboard ---------- */
function isTyping(e) {
  const t = e.target;
  return t && (t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || (t.tagName === 'INPUT' && !['checkbox', 'button'].includes(t.type)) || t.isContentEditable);

window.addEventListener('keydown', e => {

  const mod = e.ctrlKey || e.metaKey;
  if (e.code === 'Space') { e.preventDefault(); if (!spaceDown) { spaceDown = true; updateCursor(); } return; }
  if (mod && e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.code === 'KeyY') { e.preventDefault(); redo(); return; }
  if (mod && e.altKey && e.code === 'KeyG') { e.preventDefault(); toggleClip(); return; }
  if (mod && (e.code === 'Digit0' || e.code === 'Numpad0')) { e.preventDefault(); e.altKey ? actualPixels() : fitView(); return; }
  if (mod && (e.key === '+' || e.key === '=' || e.key === ';' || e.code === 'NumpadAdd')) { e.preventDefault(); zoomAt(1.25); return; }
  if (mod && (e.key === '-' || e.code === 'NumpadSubtract')) { e.preventDefault(); zoomAt(0.8); return; }
  const l = sel();
  if (!l) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeLayer(l); return; }
  if (l.type === 'image' && e.key.startsWith('Arrow')) {
    e.preventDefault();
    const st = e.shiftKey ? 10 : 1;
    checkpoint('nudge' + l.id);
    if (e.key === 'ArrowLeft') l.cx -= st;
    if (e.key === 'ArrowRight') l.cx += st;
    if (e.key === 'ArrowUp') l.cy -= st;
    if (e.key === 'ArrowDown') l.cy += st;
    refreshImageProps(l);
    dirty = true;
    scheduleSave();
  }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') { spaceDown = false; updateCursor(); } });
window.addEventListener('blur', () => { spaceDown = false; });

/* ================================================================
   Render
   ================================================================ */
function renderContent(l, fb, chSrc, ctx) {
  const W = canvas.width, H = canvas.height;
  if (l.type === 'image') {
    gl.useProgram(P.image.prog);
    bindTex(0, l.tex);
    gl.uniform1i(P.image.u.uTex, 0);
    gl.uniformMatrix3fv(P.image.u.uInv, false, imageInvMatrix(l, ctx.ps));
    gl.uniform2f(P.image.u.uImg, l.iw, l.ih);
    gl.uniform1f(P.image.u.uCanvasH, H);
    drawTo(fb);
    return;
  }
  const U = l.U;
  if (U.iChannel0) {
    gl.useProgram(P.unpremul.prog);
    bindTex(0, chSrc);
    gl.uniform1i(P.unpremul.u.uSrc, 0);
    drawTo(RT.ch.fb);
  }
  gl.useProgram(l.prog);
  bindTex(0, RT.ch.tex);
  gl.uniform1i(U.iChannel0, 0);
  gl.uniform3f(U.iResolution, W, H, 1);
  gl.uniform1f(U.iTime, ctx.time);
  gl.uniform1f(U.iTimeDelta, ctx.dt);
  gl.uniform1i(U.iFrame, ctx.frame);
  gl.uniform1f(U.iFrameRate, ctx.s.fps);
  gl.uniform1f(U.iDuration, ctx.s.dur);
  const mz = mouse.cx * W, mw = mouse.cy * H;
  gl.uniform4f(U.iMouse, mouse.x * W, mouse.y * H, mouse.down ? mz : -mz, mouse.down ? mw : -mw);
  const d = new Date();
  gl.uniform4f(U.iDate, d.getFullYear(), d.getMonth(), d.getDate(), d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds());
  const res = new Float32Array(12);
  res[0] = W; res[1] = H; res[2] = 1;
  gl.uniform3fv(U.iChannelResolution, res);
  gl.uniform1i(U._alphaMode, l.alphaMode);
  drawTo(fb);
}

/** レイヤーの中身＋加工を描き、結果のテクスチャを返す */
function layerTexture(l, chSrc, ctx) {
  renderContent(l, RT.layer.fb, chSrc, ctx);
  const f = l.fx;
  if (!fxActive(f)) return RT.layer.tex;
  const W = canvas.width, H = canvas.height;
  let src = RT.layer.tex, pi = 0;
  const next = () => { const t = RT.fx[pi]; pi ^= 1; return t; };
  if (fxColorActive(f)) {
    const t = next();
    const u = P.fxc.u;
    gl.useProgram(P.fxc.prog);
    bindTex(0, src);
    gl.uniform1i(u.uSrc, 0);
    gl.uniform1i(u.uKey, f.key === 'white' ? 1 : f.key === 'black' ? 2 : 0);
    gl.uniform1i(u.uColorOn, f.colorOn ? 1 : 0);
    gl.uniform3f(u.uColor, ...hex2rgb(f.color));
    gl.uniform1f(u.uBright, f.bright / 200);
    gl.uniform1f(u.uContrast, f.contrast >= 0 ? 1 / (1 - f.contrast / 100 * 0.95) : 1 + f.contrast / 100);
    gl.uniform1f(u.uHue, f.hue);
    gl.uniform1f(u.uSat, f.sat / 100);
    gl.uniform1f(u.uLight, f.light / 100);
    gl.uniform1i(u.uInvert, f.invert ? 1 : 0);
    gl.uniform1f(u.uPoster, f.posterize >= 2 ? f.posterize : 0);
    drawTo(t.fb);
    src = t.tex;
  }
  if (f.outline > 0) {
    const t = next();
    gl.useProgram(P.outline.prog);
    bindTex(0, src);
    gl.uniform1i(P.outline.u.uSrc, 0);
    gl.uniform2f(P.outline.u.uSize, W, H);
    gl.uniform1f(P.outline.u.uR, f.outline * ctx.ps);
    gl.uniform3f(P.outline.u.uCol, ...hex2rgb(f.outlineColor));
    drawTo(t.fb);
    src = t.tex;
  }
  if (f.blur > 0) {
    const sigma = Math.max(0.3, f.blur * ctx.ps / 2);
    for (const dir of [[1, 0], [0, 1]]) {
      const t = next();
      gl.useProgram(P.blur.prog);
      bindTex(0, src);
      gl.uniform1i(P.blur.u.uSrc, 0);
      gl.uniform2f(P.blur.u.uSize, W, H);
      gl.uniform2f(P.blur.u.uDir, dir[0], dir[1]);
      gl.uniform1f(P.blur.u.uSigma, sigma);
      drawTo(t.fb);
      src = t.tex;
    }
  }
  return src;
}

function composite(baseTex, layerTex, opacity, blend, outFb, clip) {
  gl.useProgram(P.comp.prog);
  bindTex(0, baseTex);
  bindTex(1, layerTex);
  gl.uniform1i(P.comp.u.uBase, 0);
  gl.uniform1i(P.comp.u.uLayer, 1);
  gl.uniform1f(P.comp.u.uOpacity, opacity);
  gl.uniform1i(P.comp.u.uMode, BLEND_ID[blend] ?? 0);
  gl.uniform1i(P.comp.u.uClip, clip ? 1 : 0);
  drawTo(outFb);
  unbindAll();
}

function render(time, frame, dt) {
  const s = S();
  const W = canvas.width, H = canvas.height;
  ensureTargets(W, H);
  const ctx = { time, frame, dt, s, ps: W / s.w };
  let cur = 0;
  clearTarget(RT.acc[0]);

  let i = 0;
  while (i < layers.length) {
    const base = layers[i];
    const clipped = [];
    let j = i + 1;
    while (j < layers.length && layers[j].clip) clipped.push(layers[j++]);
    i = j;
    if (!base.visible || base.opacity <= 0 || !layerReady(base)) continue;   // 下地が非表示ならクリッピングも非表示
    const vis = clipped.filter(c => c.visible && c.opacity > 0 && layerReady(c));

    if (!vis.length) {
      const tex = layerTexture(base, RT.acc[cur].tex, ctx);
      composite(RT.acc[cur].tex, tex, base.opacity, base.blend, RT.acc[1 - cur].fb, false);
      cur ^= 1;
      continue;
    }
    // クリッピンググループ: 下地 → grp、クリッピングレイヤーを下地の内側に重ねる
    let g = 0;
    const baseTex = layerTexture(base, RT.acc[cur].tex, ctx);
    gl.useProgram(P.copy.prog);
    bindTex(0, baseTex);
    gl.uniform1i(P.copy.u.uSrc, 0);
    drawTo(RT.grp[0].fb);
    unbindAll();
    for (const c of vis) {
      const tex = layerTexture(c, RT.grp[g].tex, ctx);
      composite(RT.grp[g].tex, tex, c.opacity, c.blend, RT.grp[1 - g].fb, true);
      g ^= 1;
    }
    composite(RT.acc[cur].tex, RT.grp[g].tex, base.opacity, base.blend, RT.acc[1 - cur].fb, false);
    cur ^= 1;
  }

  gl.useProgram(P.final.prog);
  bindTex(0, RT.acc[cur].tex);
  gl.uniform1i(P.final.u.uSrc, 0);
  gl.uniform1i(P.final.u.uBlack, s.blackBg ? 1 : 0);
  drawTo(null);
  unbindAll();
}

/* ---------- playback ---------- */
let playing = true, elapsed = 0, last = performance.now(), frameCounter = 0;
let dirty = true, exporting = false, scrubbing = false;

function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!exporting) {
    const s = S();
    if (playing && !scrubbing) {
      elapsed += dt;
      if ($('#loop').checked) elapsed = ((elapsed % s.dur) + s.dur) % s.dur;
    }
    if (playing || dirty) {
      render(s.start + elapsed, frameCounter++, dt);
      dirty = false;
      $('#scrub').value = Math.min(elapsed, s.dur);
      $('#timeText').textContent = `${(s.start + elapsed).toFixed(3)}s / f${Math.floor(elapsed * s.fps + 1e-6)}`;
    }
    drawOverlay();
  }
  requestAnimationFrame(tick);
}
$('#btnPlay').addEventListener('click', () => {
  playing = !playing;
  $('#btnPlay').textContent = playing ? '一時停止' : '再生';
});
$('#scrub').addEventListener('input', () => { elapsed = +$('#scrub').value; dirty = true; });
$('#scrub').addEventListener('pointerdown', () => { scrubbing = true; });
window.addEventListener('pointerup', () => { scrubbing = false; });

/* ================================================================
   Export
   ================================================================ */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
/** 無圧縮(store)ZIP。PNGはすでに圧縮済みなので再圧縮は不要 */
class ZipSink {
  constructor() {
    this.parts = []; this.central = []; this.offset = 0; this.cdSize = 0; this.count = 0;
    const d = new Date();
    this.time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    this.date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  }
  async add(name, blob) {
    const data = new Uint8Array(await blob.arrayBuffer());
    const crc = crc32(data), size = data.length;
    const nb = new TextEncoder().encode(name);
    if (this.offset + 30 + nb.length + size > 0xFFFFFFFF)
      throw new Error('ZIPが4GBを超えます。「フォルダへ書き出し」を使ってください');
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, this.time, true); lh.setUint16(12, this.date, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, nb.length, true); lh.setUint16(28, 0, true);
    this.parts.push(lh, nb, blob);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, this.time, true);
    ch.setUint16(14, this.date, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true);
    ch.setUint32(24, size, true); ch.setUint16(28, nb.length, true); ch.setUint16(30, 0, true);
    ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, this.offset, true);
    this.central.push(ch, nb);
    this.offset += 30 + nb.length + size;
    this.cdSize += 46 + nb.length;
    this.count++;
  }
  async finish(zipName) {
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(4, 0, true); end.setUint16(6, 0, true);
    end.setUint16(8, this.count, true); end.setUint16(10, this.count, true);
    end.setUint32(12, this.cdSize, true); end.setUint32(16, this.offset, true); end.setUint16(20, 0, true);
    download(new Blob([...this.parts, ...this.central, end], { type: 'application/zip' }), zipName);
  }
}
class DirSink {
  constructor(dir) { this.dir = dir; }
  async add(name, blob) {
    const fh = await this.dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(blob);
    await w.close();
  }
  async finish() {}
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
const canvasBlob = () => new Promise((res, rej) =>
  canvas.toBlob(b => b ? res(b) : rej(new Error('PNGの生成に失敗しました（解像度が大きすぎる可能性があります）')), 'image/png'));

let cancelReq = false;
function setBusy(b) {
  exporting = b;
  ['#btnStill', '#btnZip', '#btnDir'].forEach(id => { $(id).disabled = b || (id === '#btnDir' && !window.showDirectoryPicker); });
  $('#btnCancel').hidden = !b;
}
function setStatus(t) { $('#status').textContent = t; }
function setProgress(r) { $('#bar').style.width = (r * 100).toFixed(1) + '%'; }

async function exportStill() {
  const s = S();
  setBusy(true);
  try {
    applyResolution(1);
    const t = s.start + elapsed;
    render(t, Math.floor(elapsed * s.fps), 1 / s.fps);
    download(await canvasBlob(), `${s.prefix}t${t.toFixed(3)}.png`);
    setStatus(`PNGを書き出しました（${s.w}×${s.h}）`);
  } catch (e) {
    setStatus('エラー: ' + e.message);
  } finally {
    applyResolution();
    setBusy(false);
  }
}
async function exportSequence(kind) {
  const s = S();
  const n = frameCountOf(s);
  let sink;
  if (kind === 'dir') {
    try { sink = new DirSink(await window.showDirectoryPicker({ mode: 'readwrite' })); }
    catch (e) { if (e.name !== 'AbortError') setStatus('エラー: ' + e.message); return; }
  } else sink = new ZipSink();

  const pad = Math.max(4, String(n - 1).length);
  cancelReq = false;
  setBusy(true);
  setProgress(0);
  const t0 = performance.now();
  try {
    applyResolution(1);
    for (let i = 0; i < n; i++) {
      if (cancelReq) break;
      render(s.start + i / s.fps, i, 1 / s.fps);
      await sink.add(`${s.prefix}${String(i).padStart(pad, '0')}.png`, await canvasBlob());
      setProgress((i + 1) / n);
      setStatus(`${i + 1} / ${n}`);
      if (i % 3 === 2) await new Promise(r => setTimeout(r, 0));
    }
    if (cancelReq) setStatus('中止しました');
    else {
      if (kind === 'zip') setStatus('ZIPを作成中…');
      const base = s.prefix.replace(/[_\-.\s]+$/, '') || 'frames';
      await sink.finish(`${base}_${s.w}x${s.h}_${s.fps}fps_${n}f.zip`);
      setStatus(`完了：${n}フレーム（${((performance.now() - t0) / 1000).toFixed(1)}秒）`);
    }
  } catch (e) {
    setStatus('エラー: ' + e.message);
  } finally {
    applyResolution();
    setBusy(false);
  }
}
$('#btnStill').addEventListener('click', exportStill);
$('#btnZip').addEventListener('click', () => exportSequence('zip'));
$('#btnDir').addEventListener('click', () => exportSequence('dir'));
$('#btnCancel').addEventListener('click', () => { cancelReq = true; });

/* ================================================================
   Persistence（設定とGLSL → localStorage / 画像 → IndexedDB）
   ================================================================ */
const idb = (() => {
  let dbp = null;
  const open = () => dbp ??= new Promise((res, rej) => {
    const r = indexedDB.open('glsl-effect-exporter', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('images');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('images', mode);
      const req = fn(t.objectStore('images'));
      t.oncomplete = () => res(req.result);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    put: (k, v) => run('readwrite', s => s.put(v, k)),
    get: k => run('readonly', s => s.get(k)),
    del: k => run('readwrite', s => s.delete(k)),
    keys: () => run('readonly', s => s.getAllKeys()),
  };
})();

const STORE_KEY = 'glsl-effect-exporter.v3';
const V2_KEY = 'glsl-effect-exporter.v2';
const V1_KEY = 'withgaraku.glsl-exporter.v1';
const SETTING_IDS = ['w','h','fps','dur','start','prefix','pscale','bgMode','bgColor','blackBg','loop','autoCompile','pLock'];
let saveTimer = 0, booting = true;
function scheduleSave() {
  if (booting) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      const settings = {};
      for (const id of SETTING_IDS) {
        const el = $('#' + id);
        settings[id] = el.type === 'checkbox' ? el.checked : el.value;
      }
      const ls = layers.map(l => {
        const base = { id: l.id, type: l.type, name: l.name, visible: l.visible, opacity: l.opacity,
          blend: l.blend, clip: l.clip, fx: l.fx };
        return l.type === 'shader'
          ? { ...base, code: l.code, alphaMode: l.alphaMode }
          : { ...base, cx: l.cx, cy: l.cy, sx: l.sx, sy: l.sy, rot: l.rot, flipH: l.flipH, flipV: l.flipV, interp: l.interp };
      });
      localStorage.setItem(STORE_KEY, JSON.stringify({ settings, layers: ls, selId }));
    } catch (_) { /* storage unavailable */ }
  }, 300);
}
function applySettings(settings) {
  for (const [k, v] of Object.entries(settings || {})) {
    const el = $('#' + k);
    if (!el || !SETTING_IDS.includes(k)) continue;
    if (el.type === 'checkbox') el.checked = !!v; else el.value = v;
  }
  if ($('#bgMode').selectedIndex < 0) $('#bgMode').value = 'checker-dark';
}
async function restoreLayers(list, legacy) {
  const s = S();
  for (const d of list || []) {
    if (legacy && d.blend === 'add') d.blend = 'addglow';   // 旧「加算（発光）」
    if (d.type === 'shader') {
      const l = makeShaderLayer(d);
      compileLayer(l);
      layers.push(l);
    } else if (d.type === 'image') {
      try {
        const blob = await idb.get(d.id);
        if (!blob) continue;
        const l = makeImageLayer({ ...d, blob });
        await loadImageLayer(l);
        if (legacy || d.cx === undefined) {           // 旧形式（割合・キャンバスに収まる大きさ基準）
          const k = Math.min(s.w / l.iw, s.h / l.ih) * (d.scale ?? 1);
          Object.assign(l, { cx: (d.x ?? 0.5) * s.w, cy: (d.y ?? 0.5) * s.h, sx: k, sy: k });
        }
        layers.push(l);
      } catch (_) { /* 画像が読めなければ飛ばす */ }
    }
  }
}
async function restore() {
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } };
  let data = read(STORE_KEY), legacy = false;
  if (!data) { data = read(V2_KEY); legacy = !!data; }
  if (data) {
    applySettings(data.settings);
    await restoreLayers(data.layers, legacy);
    return byId(data.selId) ? data.selId : (layers.at(-1)?.id ?? null);
  }
  const old = read(V1_KEY);
  if (old && typeof old.code === 'string') {
    const { alphaMode, ...rest } = old.settings || {};
    applySettings(rest);
    const l = makeShaderLayer({ code: old.code, alphaMode: +alphaMode || 0 });
    compileLayer(l);
    layers.push(l);
    return l.id;
  }
  return null;
}
async function cleanupImages() {
  try {
    const live = new Set(layers.map(l => l.id));
    for (const k of await idb.keys()) if (!live.has(k)) await idb.del(k);
  } catch (_) {}
}

/* ================================================================
   Boot
   ================================================================ */
(async () => {
  if (!gl) {
    log.textContent = 'このブラウザでは WebGL2 が使えません。最新の Chrome / Edge / Firefox / Safari で開いてください。';
    log.className = 'log err';
    return;
  }
  initGL();
  let first = await restore();
  if (!layers.length && first === null) {
    const p = PRESETS[0];
    const l = makeShaderLayer({ name: p.name, code: p.code, alphaMode: p.alphaMode, blend: p.blend });
    compileLayer(l);
    layers.push(l);
    first = l.id;
  }
  applyBg();
  onSettingsChange();
  selectLayer(first);
  updateUndoButtons();
  if (!window.showDirectoryPicker) {
    $('#btnDir').disabled = true;
    $('#btnDir').title = 'このブラウザは未対応です（Chrome / Edge で使えます）';
  }
  booting = false;
  scheduleSave();
  cleanupImages();
  requestAnimationFrame(tick);
})();
</script>
