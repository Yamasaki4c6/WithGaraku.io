const num = (id, def, min, max) => {
  let v = parseFloat($(id).value);
  if (!isFinite(v)) v = def;
  return Math.min(max, Math.max(min, v));
};
function S() {
  return {
    w: Math.round(num('#w', 1920, 1, 8192)),
    h: Math.round(num('#h', 1080, 1, 8192)),
    fps: num('#fps', 30, 1, 240),
    dur: num('#dur', 2, 0.01, 3600),
    start: num('#start', 0, -1e6, 1e6),
    prefix: ($('#prefix').value || 'frame_').replace(/[\\/:*?"<>|]/g, '_'),
    blackBg: $('#blackBg').checked,
    pscale: +$('#pscale').value,
  };
}
const frameCountOf = s => Math.max(1, Math.round(s.dur * s.fps));

/* ---------- 比率・長辺のプルダウン ---------- */
const RATIOS = [
  ['16:9', 16, 9], ['9:16', 9, 16], ['1:1', 1, 1], ['4:3', 4, 3], ['3:4', 3, 4], ['3:2', 3, 2], ['2:3', 2, 3],
  ['4:5', 4, 5], ['5:4', 5, 4], ['21:9', 21, 9], ['2:1', 2, 1], ['1:2', 1, 2],
  ['A判 横', Math.SQRT2, 1], ['A判 縦', 1, Math.SQRT2],
];
const LONG_SIDES = [512, 720, 1024, 1080, 1280, 1920, 2048, 2560, 3000, 3840, 4096];
(() => {
  const r = $('#ratio');
  r.add(new Option('自由', 'free'));
  RATIOS.forEach(([label], i) => r.add(new Option(label, i)));
  const ls = $('#longSide');
  ls.add(new Option('—', 'custom'));
  LONG_SIDES.forEach(v => ls.add(new Option(v + 'px', v)));
})();
function setOutputSize(w, h) {
  $('#w').value = Math.max(1, Math.round(w));
  $('#h').value = Math.max(1, Math.round(h));
  onSettingsChange();
  fitView();
}
function applyRatio() {
  const ri = $('#ratio').value;
  if (ri === 'free') return;
  const [, rw, rh] = RATIOS[+ri];
  const s = S();
  const L = $('#longSide').value === 'custom' ? Math.max(s.w, s.h) : +$('#longSide').value;
  if (rw >= rh) setOutputSize(L, L * rh / rw);
  else setOutputSize(L * rw / rh, L);
}
function syncRatioUI() {
  const s = S();
  const r = s.w / s.h;
  const idx = RATIOS.findIndex(([, rw, rh]) => Math.abs(r / (rw / rh) - 1) < 0.004);
  $('#ratio').value = idx >= 0 ? idx : 'free';
  const L = Math.max(s.w, s.h);
  const ls = $('#longSide');
  ls.options[0].textContent = LONG_SIDES.includes(L) ? '—' : `${L}px`;
  ls.value = LONG_SIDES.includes(L) ? L : 'custom';
}
$('#ratio').addEventListener('change', applyRatio);
$('#longSide').addEventListener('change', () => {
  if ($('#ratio').value === 'free') {
    const s = S(), L = +$('#longSide').value;
    if (!L) return;
    const k = L / Math.max(s.w, s.h);
    setOutputSize(s.w * k, s.h * k);
  } else applyRatio();
});
$('#swapWH').addEventListener('click', () => { const s = S(); setOutputSize(s.h, s.w); });

function applyResolution(scale) {
  const s = S();
  const sc = scale ?? s.pscale;
  canvas.width = Math.max(1, Math.round(s.w * sc));
  canvas.height = Math.max(1, Math.round(s.h * sc));
  dirty = true;
}

// 表示（クリスタの表示倍率・スクロールに相当）
const view = { zoom: 1, panX: 0, panY: 0, k: 1, k0: 1, left: 0, top: 0 };
const overlay = $('#overlay');
const octx = overlay.getContext('2d');
function fitStage() {
  const s = S();
  const pw = previewEl.clientWidth, ph = previewEl.clientHeight;
  view.k0 = Math.max(0.001, Math.min((pw - 40) / s.w, (ph - 40) / s.h));
  view.k = view.k0 * view.zoom;
  const w = s.w * view.k, h = s.h * view.k;
  view.left = (pw - w) / 2 + view.panX;
  view.top = (ph - h) / 2 + view.panY;
  const st = $('#stage').style;
  st.left = view.left + 'px'; st.top = view.top + 'px';
  st.width = w + 'px'; st.height = h + 'px';
  const dpr = window.devicePixelRatio || 1;
  if (overlay.width !== Math.round(pw * dpr) || overlay.height !== Math.round(ph * dpr)) {
    overlay.width = Math.round(pw * dpr);
    overlay.height = Math.round(ph * dpr);
  }
  $('#zoomChip').textContent = Math.round(view.k * 100) + '%';
}
function zoomAt(factor, mx, my) {
  const s = S();
  const pw = previewEl.clientWidth, ph = previewEl.clientHeight;
  if (mx === undefined) { mx = pw / 2; my = ph / 2; }
  const ox = (mx - view.left) / view.k, oy = (my - view.top) / view.k;
  const k = Math.min(32, Math.max(0.02, view.k * factor));
  view.zoom = k / view.k0;
  view.panX = (mx - ox * k) - (pw - s.w * k) / 2;
  view.panY = (my - oy * k) - (ph - s.h * k) / 2;
  fitStage();
}
function fitView() { view.zoom = 1; view.panX = 0; view.panY = 0; fitStage(); }
function actualPixels() { view.zoom = 1 / view.k0; view.panX = 0; view.panY = 0; fitStage(); }
$('#zoomChip').addEventListener('click', fitView);

function updateFrameInfo() {
  const s = S();
  const n = frameCountOf(s);
  $('#frameInfo').textContent = `${n}フレーム`;
  $('#frameInfo').title = `${s.start.toFixed(2)}s 〜 ${(s.start + (n - 1) / s.fps).toFixed(2)}s`;
  $('#scrub').max = s.dur;
  $('#scrub').step = 1 / s.fps;
}
function onSettingsChange() {
  applyResolution();
  fitStage();
  updateFrameInfo();
  syncRatioUI();
  scheduleSave();
}
['#w','#h','#fps','#dur','#start','#prefix','#blackBg','#pscale'].forEach(id =>
  $(id).addEventListener('change', onSettingsChange));
['#w','#h','#fps','#dur','#start'].forEach(id => $(id).addEventListener('input', updateFrameInfo));
new ResizeObserver(fitStage).observe(previewEl);

function applyBg() {
  const mode = $('#bgMode').value;
  const stage = $('#stage');
  stage.className = 'stage';
  stage.style.background = '';
  $('#bgColor').hidden = mode !== 'color';
  if (mode === 'checker-dark') stage.classList.add('bg-checker-dark');
  else if (mode === 'checker-light') stage.classList.add('bg-checker-light');
  else if (mode === 'black') stage.style.background = '#000';
  else if (mode === 'white') stage.style.background = '#fff';
  else if (mode === 'color') stage.style.background = $('#bgColor').value;
  scheduleSave();
}
$('#bgMode').addEventListener('change', applyBg);
$('#bgColor').addEventListener('input', applyBg);

/* ---------- エディタ／ビューポートの比率 ---------- */
const UI_KEY = 'glsl-effect-exporter.ui';
const ui = { edw: null, lastEdw: 480, tool: 'move' };
function loadUI() {
  try { Object.assign(ui, JSON.parse(localStorage.getItem(UI_KEY) || '{}')); } catch (_) {}
  for (const id of ['brushColor', 'brushSize', 'brushOpacity', 'brushPressure', 'lassoMode']) {
    if (ui[id] === undefined) continue;
    const el = $('#' + id);
    if (el.type === 'checkbox') el.checked = !!ui[id]; else el.value = ui[id];
  }
  $('#brushSizeN').value = $('#brushSize').value;
  $('#brushOpacityN').value = $('#brushOpacity').value;
  applyEditorWidth(ui.edw);
}
function saveUI() {
  for (const id of ['brushColor', 'brushSize', 'brushOpacity', 'brushPressure', 'lassoMode']) {
    const el = $('#' + id);
    ui[id] = el.type === 'checkbox' ? el.checked : el.value;
  }
  try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch (_) {}
}
function applyEditorWidth(px) {
  const app = $('#app');
  if (px === null || px === undefined) { app.style.removeProperty('--edw'); app.classList.remove('collapsed'); return; }
  app.style.setProperty('--edw', px + 'px');
  app.classList.toggle('collapsed', px === 0);
}
(() => {
  const sp = $('#splitter');
  let drag = null;
  sp.addEventListener('pointerdown', e => {
    sp.setPointerCapture(e.pointerId);
    sp.classList.add('drag');
    drag = { x0: e.clientX, w0: $('.editor-col').getBoundingClientRect().width };
  });
  sp.addEventListener('pointermove', e => {
    if (!drag) return;
    let w = drag.w0 + (e.clientX - drag.x0);
    w = Math.min(window.innerWidth - 520, Math.max(0, w));
    if (w < 140) w = 0;
    ui.edw = Math.round(w);
    if (w > 0) ui.lastEdw = ui.edw;
    applyEditorWidth(ui.edw);
  });
  const end = () => { if (!drag) return; drag = null; sp.classList.remove('drag'); saveUI(); };
  sp.addEventListener('pointerup', end);
  sp.addEventListener('pointercancel', end);
  sp.addEventListener('dblclick', () => {
    ui.edw = ui.edw === 0 ? (ui.lastEdw || 480) : 0;
    applyEditorWidth(ui.edw);
    saveUI();
  });
})();

/* ================================================================
   ツール（移動・変形 / ペン / 消しゴム / 投げ縄 / 手のひら）
   ================================================================ */
let tool = 'move';
function setTool(t) {
  tool = t;
  ui.tool = t;
  document.querySelectorAll('#toolbar [data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  document.querySelectorAll('#toolopts [data-for]').forEach(el => { el.hidden = !el.dataset.for.split(' ').includes(t); });
  updateCursor();
  saveUI();
}
document.querySelectorAll('#toolbar [data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
const bindPair = (r, n) => {
  $(r).addEventListener('input', () => { $(n).value = $(r).value; saveUI(); });
  $(n).addEventListener('change', () => { $(r).value = $(n).value; $(n).value = $(r).value; saveUI(); });
};
bindPair('#brushSize', '#brushSizeN');
bindPair('#brushOpacity', '#brushOpacityN');
['#brushColor', '#brushPressure', '#lassoMode'].forEach(id => $(id).addEventListener('change', saveUI));
const brushSize = () => Math.max(1, +$('#brushSizeN').value || 8);
function setBrushSize(v) { v = Math.min(500, Math.max(1, Math.round(v))); $('#brushSizeN').value = v; $('#brushSize').value = v; saveUI(); }

const HANDLES = [
  ['nw', 0, 0], ['n', 0.5, 0], ['ne', 1, 0], ['e', 1, 0.5],
  ['se', 1, 1], ['s', 0.5, 1], ['sw', 0, 1], ['w', 0, 0.5],
];
const ROT_CURSOR = `url("data:image/svg+xml,${encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2-5" fill="none" stroke="#000" stroke-width="4"/><path d="M5 12a7 7 0 1 0 2-5" fill="none" stroke="#fff" stroke-width="2"/><path d="M3 3v6h6z" fill="#fff" stroke="#000"/></svg>')}") 12 12, auto`;

const mouse = { x: 0, y: 0, cx: 0, cy: 0, down: false };
let op = null, spaceDown = false, hover = null;

const toScreen = (ox, oy) => [view.left + ox * view.k, view.top + oy * view.k];
const toOut = (mx, my) => [(mx - view.left) / view.k, (my - view.top) / view.k];
function localPoint(e) {
  const r = previewEl.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}
function hitTest(l, mx, my) {
  for (const [id, hx, hy] of HANDLES) {
    const [sx, sy] = toScreen(...localToOut(l, hx * l.iw, hy * l.ih));
    if (Math.hypot(mx - sx, my - sy) <= 9) return { type: 'handle', id, hx, hy };
  }
  const [Lx, Ly] = outToLocal(l, ...toOut(mx, my));
  if (Lx >= 0 && Ly >= 0 && Lx <= l.iw && Ly <= l.ih) return { type: 'inside' };
  return { type: 'outside' };
}
function resizeCursor(l, hx, hy) {
  const [cx, cy] = toScreen(l.cx, l.cy);
  const [sx, sy] = toScreen(...localToOut(l, hx * l.iw, hy * l.ih));
  const a = ((Math.atan2(sy - cy, sx - cx) * 180 / Math.PI) % 180 + 180) % 180;
  return a < 22.5 || a >= 157.5 ? 'ew-resize' : a < 67.5 ? 'nwse-resize' : a < 112.5 ? 'ns-resize' : 'nesw-resize';
}
function updateCursor(mx, my) {
  if (mx !== undefined) hover = [mx, my];
  if (op) return;
  if (spaceDown || tool === 'hand') { overlay.style.cursor = 'grab'; return; }
  if (tool === 'pen' || tool === 'eraser') { overlay.style.cursor = 'none'; return; }
  if (tool === 'lasso') { overlay.style.cursor = 'crosshair'; return; }
  const l = sel();
  if (!isRaster(l) || !l.visible || !hover) {
    overlay.style.cursor = isRaster(l) ? 'default' : 'crosshair';
    return;
  }
  const h = hitTest(l, ...hover);
  overlay.style.cursor = h.type === 'handle' ? resizeCursor(l, h.hx, h.hy) : h.type === 'inside' ? 'move' : ROT_CURSOR;
}
function pickRasterAt(mx, my) {
  const [ox, oy] = toOut(mx, my);
  const list = allNodes().filter(isRaster).reverse();   // 上から
  for (const l of list) {
    if (!l.visible) continue;
    const [Lx, Ly] = outToLocal(l, ox, oy);
    if (Lx >= 0 && Ly >= 0 && Lx <= l.iw && Ly <= l.ih) { selectLayer(l.id); return true; }
  }
  return false;
}

/* ---------- 描画（ペン・消しゴム・投げ縄） ---------- */
function paintTarget(forErase) {
  const l = sel();
  if (l && l.type === 'paint') return l;
  if (forErase) { setStatus('消しゴム・投げ縄消去は描画レイヤーを選んで使います'); return null; }
  return addPaintLayer();
}
function beginPaintEdit(l) {
  // コピーオンライト：元のキャンバスは取り消し用に残す
  checkpoint();
  paintEditCount++;
  const base = l.canvas;
  l.canvas = cloneCanvas(base);
  return base;
}
function strokeComposite(o) {
  const ctx = o.l.canvas.getContext('2d');
  ctx.save();
  ctx.globalCompositeOperation = 'copy';
  ctx.drawImage(o.base, 0, 0);
  ctx.globalCompositeOperation = o.eraser ? 'destination-out' : 'source-over';
  ctx.globalAlpha = o.opacity;
  ctx.drawImage(o.stroke, 0, 0);
  ctx.restore();
  o.l.texDirty = true;
  dirty = true;
}
function strokeTo(o, ox, oy, pressure) {
  const [x, y] = outToLocal(o.l, ox, oy);
  const scale = Math.max(1e-3, (o.l.sx + o.l.sy) / 2);
  const w = Math.max(0.5, brushSize() * (o.usePressure ? pressure : 1) / scale);
  const c = o.sctx;
  c.fillStyle = c.strokeStyle = o.eraser ? '#000' : $('#brushColor').value;
  if (!o.last) {
    c.beginPath(); c.arc(x, y, w / 2, 0, Math.PI * 2); c.fill();
  } else {
    c.lineWidth = w;
    c.beginPath(); c.moveTo(o.last[0], o.last[1]); c.lineTo(x, y); c.stroke();
  }
  o.last = [x, y];
}
function fillLasso(l, pts, mode) {
  const base = beginPaintEdit(l);
  const ctx = l.canvas.getContext('2d');
  ctx.save();
  ctx.beginPath();
  pts.forEach(([ox, oy], i) => { const [x, y] = outToLocal(l, ox, oy); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath();
  ctx.globalAlpha = (+$('#brushOpacityN').value || 100) / 100;
  ctx.globalCompositeOperation = mode === 'erase' ? 'destination-out' : 'source-over';
  ctx.fillStyle = mode === 'erase' ? '#000' : $('#brushColor').value;
  ctx.fill();
  ctx.restore();
  void base;
  l.texDirty = true;
  dirty = true;
  schedulePaintSave(l);
  renderLayerList();
  scheduleSave();
}

overlay.addEventListener('pointerdown', e => {
  const [mx, my] = localPoint(e);
  hover = [mx, my];
  if (e.button === 1 || (e.button === 0 && (spaceDown || tool === 'hand'))) {
    e.preventDefault();
    overlay.setPointerCapture(e.pointerId);
    op = { type: 'pan', sx: e.clientX, sy: e.clientY, px: view.panX, py: view.panY };
    overlay.style.cursor = 'grabbing';
    return;
  }
  if (e.button !== 0) return;
  if ((e.ctrlKey || e.metaKey) && tool === 'move') { pickRasterAt(mx, my); return; }
  const [ox, oy] = toOut(mx, my);

  if (tool === 'pen' || tool === 'eraser') {
    const l = paintTarget(tool === 'eraser');
    if (!l) return;
    if (!l.visible) { setStatus('非表示のレイヤーには描けません'); return; }
    overlay.setPointerCapture(e.pointerId);
    const base = beginPaintEdit(l);
    const stroke = document.createElement('canvas');
    stroke.width = l.canvas.width; stroke.height = l.canvas.height;
    const sctx = stroke.getContext('2d');
    sctx.lineCap = 'round'; sctx.lineJoin = 'round';
    op = { type: 'stroke', l, base, stroke, sctx, last: null, eraser: tool === 'eraser',
      opacity: (+$('#brushOpacityN').value || 100) / 100,
      usePressure: $('#brushPressure').checked && e.pointerType !== 'mouse' };
    strokeTo(op, ox, oy, e.pressure || 0.5);
    strokeComposite(op);
    return;
  }
  if (tool === 'lasso') {
    overlay.setPointerCapture(e.pointerId);
    op = { type: 'lasso', pts: [[ox, oy]], last: [mx, my] };
    return;
  }
  // 移動・変形ツール
  overlay.setPointerCapture(e.pointerId);
  const l = sel();
  if (isRaster(l) && l.visible) {
    const h = hitTest(l, mx, my);
    checkpoint();
    const base = { l, ox, oy, cx: l.cx, cy: l.cy, rot: l.rot, ...tf(l) };
    if (h.type === 'handle') op = { ...base, type: 'scale', hx: h.hx, hy: h.hy, ssx0: base.ssx, ssy0: base.ssy };
    else if (h.type === 'inside') op = { ...base, type: 'move' };
    else op = { ...base, type: 'rotate', a0: Math.atan2(oy - l.cy, ox - l.cx) };
    return;
  }
  // GLSL レイヤー選択中は iMouse
  const s = S();
  mouse.x = mouse.cx = ox / s.w;
  mouse.y = mouse.cy = 1 - oy / s.h;
  mouse.down = true;
  dirty = true;
});

overlay.addEventListener('pointermove', e => {
  const [mx, my] = localPoint(e);
  hover = [mx, my];
  if (!op) {
    if (mouse.down) {
      const [ox, oy] = toOut(mx, my);
      const s = S();
      mouse.x = ox / s.w; mouse.y = 1 - oy / s.h;
      dirty = true;
    }
    updateCursor(mx, my);
    return;
  }
  if (op.type === 'pan') {
    view.panX = op.px + (e.clientX - op.sx);
    view.panY = op.py + (e.clientY - op.sy);
    fitStage();
    return;
  }
  if (op.type === 'stroke') {
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) {
      const [px, py] = localPoint(ev);
      strokeTo(op, ...toOut(px, py), ev.pressure || 0.5);
    }
    strokeComposite(op);
    return;
  }
  if (op.type === 'lasso') {
    if (Math.hypot(mx - op.last[0], my - op.last[1]) >= 2) { op.pts.push(toOut(mx, my)); op.last = [mx, my]; }
    return;
  }
  const l = op.l;
  const [ox, oy] = toOut(mx, my);
  if (op.type === 'move') {
    let dx = ox - op.ox, dy = oy - op.oy;
    if (e.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) dy = 0; else dx = 0; }
    l.cx = op.cx + dx;
    l.cy = op.cy + dy;
  } else if (op.type === 'rotate') {
    let r = op.rot + (Math.atan2(oy - op.cy, ox - op.cx) - op.a0) * 180 / Math.PI;
    if (e.shiftKey) r = Math.round(r / 15) * 15;
    l.rot = r;
  } else if (op.type === 'scale') {
    applyScaleDrag(op, ox, oy, e.shiftKey, e.altKey);
  }
  refreshImageProps(l);
  dirty = true;
});

function applyScaleDrag(o, ox, oy, shift, alt) {
  const l = o.l;
  const { c, s, ssx0, ssy0, hx, hy } = o;
  const h = [(hx - 0.5) * l.iw, (hy - 0.5) * l.ih];
  const A = alt ? [0, 0] : [-h[0], -h[1]];
  const ax0 = A[0] * ssx0, ay0 = A[1] * ssy0;
  const PA = [o.cx + c * ax0 - s * ay0, o.cy + s * ax0 + c * ay0];
  const vx = ox - PA[0], vy = oy - PA[1];
  const d = [c * vx + s * vy, -s * vx + c * vy];
  const lock = $('#pLock').checked !== shift;
  const fix = v => (Math.abs(v) < 1e-3 ? (v < 0 ? -1e-3 : 1e-3) : v);
  const ex = h[0] - A[0], ey = h[1] - A[1];
  let ssx = ssx0, ssy = ssy0;
  const corner = ex !== 0 && ey !== 0;
  if (corner && lock) {
    const hv = [ex * ssx0, ey * ssy0];
    const f = Math.max(0.01, (d[0] * hv[0] + d[1] * hv[1]) / (hv[0] * hv[0] + hv[1] * hv[1]));
    ssx = ssx0 * f; ssy = ssy0 * f;
  } else if (corner) {
    ssx = fix(d[0] / ex); ssy = fix(d[1] / ey);
  } else if (ex !== 0) {
    ssx = fix(d[0] / ex);
    if (lock) ssy = ssy0 * Math.abs(ssx / ssx0);
  } else {
    ssy = fix(d[1] / ey);
    if (lock) ssx = ssx0 * Math.abs(ssy / ssy0);
  }
  l.sx = Math.abs(ssx); l.flipH = ssx < 0;
  l.sy = Math.abs(ssy); l.flipV = ssy < 0;
  const ax = A[0] * ssx, ay = A[1] * ssy;
  l.cx = PA[0] - (c * ax - s * ay);
  l.cy = PA[1] - (s * ax + c * ay);
}

function endPointer() {
  if (op) {
    if (op.type === 'stroke') {
      schedulePaintSave(op.l);
      renderLayerList();
      scheduleSave();
    } else if (op.type === 'lasso') {
      const pts = op.pts;
      op = null;
      if (pts.length >= 3) {
        const mode = $('#lassoMode').value;
        const l = paintTarget(mode === 'erase');
        if (l && l.visible) fillLasso(l, pts, mode);
      }
    } else if (op.type !== 'pan') { refreshProps(); scheduleSave(); }
    op = null;
  }
  mouse.down = false;
  dirty = true;
  updateCursor();
}
overlay.addEventListener('pointerup', endPointer);
overlay.addEventListener('pointercancel', endPointer);
overlay.addEventListener('pointerleave', () => { if (!op) hover = null; });
overlay.addEventListener('auxclick', e => e.preventDefault());
overlay.addEventListener('wheel', e => {
  e.preventDefault();
  const [mx, my] = localPoint(e);
  const delta = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
  zoomAt(Math.exp(-delta * 0.0018), mx, my);
}, { passive: false });

function drawOverlay() {
  const dpr = window.devicePixelRatio || 1;
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.clearRect(0, 0, overlay.width, overlay.height);
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (op && op.type === 'lasso' && op.pts.length > 1) {
    octx.beginPath();
    op.pts.forEach(([ox, oy], i) => { const [x, y] = toScreen(ox, oy); i ? octx.lineTo(x, y) : octx.moveTo(x, y); });
    octx.closePath();
    octx.fillStyle = $('#lassoMode').value === 'erase' ? 'rgba(255,90,90,.15)' : 'rgba(242,180,92,.15)';
    octx.fill();
    octx.lineWidth = 1.5; octx.strokeStyle = '#000'; octx.setLineDash([]); octx.stroke();
    octx.strokeStyle = '#fff'; octx.setLineDash([5, 4]); octx.lineDashOffset = -(performance.now() / 40) % 9; octx.stroke();
    octx.setLineDash([]);
  }
  if ((tool === 'pen' || tool === 'eraser') && hover && !spaceDown) {
    const r = Math.max(1, brushSize() * view.k / 2);
    octx.beginPath(); octx.arc(hover[0], hover[1], r, 0, Math.PI * 2);
    octx.lineWidth = 2; octx.strokeStyle = 'rgba(0,0,0,.6)'; octx.stroke();
    octx.lineWidth = 1; octx.strokeStyle = '#fff'; octx.stroke();
  }
  const l = sel();
  if (tool !== 'move' || !isRaster(l) || !l.tex) return;
  const pts = [[0, 0], [1, 0], [1, 1], [0, 1]].map(([u, v]) => toScreen(...localToOut(l, u * l.iw, v * l.ih)));
  octx.beginPath();
  pts.forEach(([x, y], i) => (i ? octx.lineTo(x, y) : octx.moveTo(x, y)));
  octx.closePath();
  octx.lineWidth = 3; octx.strokeStyle = 'rgba(0,0,0,.55)'; octx.stroke();
  octx.lineWidth = 1; octx.strokeStyle = l.visible ? '#f2b45c' : '#888'; octx.setLineDash(l.visible ? [] : [4, 3]); octx.stroke();
  octx.setLineDash([]);
  if (!l.visible) return;
  for (const [, hx, hy] of HANDLES) {
    const [x, y] = toScreen(...localToOut(l, hx * l.iw, hy * l.ih));
    octx.fillStyle = '#fff'; octx.strokeStyle = '#000'; octx.lineWidth = 1;
    octx.fillRect(x - 4, y - 4, 8, 8); octx.strokeRect(x - 4.5, y - 4.5, 9, 9);
  }
  const [cx, cy] = toScreen(l.cx, l.cy);
  octx.strokeStyle = '#fff'; octx.lineWidth = 1;
  octx.beginPath(); octx.moveTo(cx - 6, cy); octx.lineTo(cx + 6, cy); octx.moveTo(cx, cy - 6); octx.lineTo(cx, cy + 6); octx.stroke();
  if (op && op.l === l && (op.type === 'rotate' || op.type === 'scale')) {
    const txt = op.type === 'rotate' ? `${l.rot.toFixed(1)}°` : `${(l.sx * 100).toFixed(1)}% × ${(l.sy * 100).toFixed(1)}%`;
    octx.font = '12px ui-monospace, monospace';
    const w = octx.measureText(txt).width + 10;
    octx.fillStyle = 'rgba(0,0,0,.7)'; octx.fillRect(cx + 10, cy + 10, w, 20);
    octx.fillStyle = '#fff'; octx.fillText(txt, cx + 15, cy + 24);
  }
}

/* ---------- keyboard ---------- */
function isTyping(e) {
  const t = e.target;
  return t && (t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || (t.tagName === 'INPUT' && !['checkbox', 'button', 'color'].includes(t.type)) || t.isContentEditable);
}
const TOOL_KEYS = { KeyV: 'move', KeyP: 'pen', KeyB: 'pen', KeyE: 'eraser', KeyL: 'lasso', KeyH: 'hand' };
window.addEventListener('keydown', e => {
  if (isTyping(e)) return;
  const mod = e.ctrlKey || e.metaKey;
  if (e.code === 'Space') { e.preventDefault(); if (!spaceDown) { spaceDown = true; updateCursor(); } return; }
  if (mod && e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.code === 'KeyY') { e.preventDefault(); redo(); return; }
  if (mod && e.altKey && e.code === 'KeyG') { e.preventDefault(); toggleClip(); return; }
  if (mod && e.code === 'KeyG') { e.preventDefault(); groupSelected(); return; }
  if (mod && (e.code === 'Digit0' || e.code === 'Numpad0')) { e.preventDefault(); e.altKey ? actualPixels() : fitView(); return; }
  if (mod && (e.key === '+' || e.key === '=' || e.key === ';' || e.code === 'NumpadAdd')) { e.preventDefault(); zoomAt(1.25); return; }
  if (mod && (e.key === '-' || e.code === 'NumpadSubtract')) { e.preventDefault(); zoomAt(0.8); return; }
  if (!mod && !e.altKey && TOOL_KEYS[e.code]) { e.preventDefault(); setTool(TOOL_KEYS[e.code]); return; }
  if (!mod && e.key === '[') { setBrushSize(brushSize() / 1.25); return; }
  if (!mod && e.key === ']') { setBrushSize(brushSize() * 1.25 + 0.5); return; }
  const l = sel();
  if (!l) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeNode(l); return; }
  if (isRaster(l) && e.key.startsWith('Arrow')) {
    e.preventDefault();
    const st = e.shiftKey ? 10 : 1;
    checkpoint('nudge' + l.id);
    if (e.key === 'ArrowLeft') l.cx -= st;
    if (e.key === 'ArrowRight') l.cx += st;
    if (e.key === 'ArrowUp') l.cy -= st;
    if (e.key === 'ArrowDown') l.cy += st;
    refreshImageProps(l);
    dirty = true;
    scheduleSave();
  }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') { spaceDown = false; updateCursor(); } });
window.addEventListener('blur', () => { spaceDown = false; });

/* ================================================================
   Render
   ================================================================ */
function renderContent(l, fb, chSrc, ctx) {
  const W = canvas.width, H = canvas.height;
  if (isRaster(l)) {
    gl.useProgram(P.image.prog);
    bindTex(0, l.tex);
    gl.uniform1i(P.image.u.uTex, 0);
    gl.uniformMatrix3fv(P.image.u.uInv, false, imageInvMatrix(l, ctx.ps));
    gl.uniform2f(P.image.u.uImg, l.iw, l.ih);
    gl.uniform1f(P.image.u.uCanvasH, H);
    drawTo(fb);
    bindTex(0, null);
    return;
  }
  const U = l.U;
  if (U.iChannel0) {
    gl.useProgram(P.unpremul.prog);
    bindTex(0, chSrc);
    gl.uniform1i(P.unpremul.u.uSrc, 0);
    drawTo(chTarget().fb);
  }
  gl.useProgram(l.prog);
  bindTex(0, chTarget().tex);
  gl.uniform1i(U.iChannel0, 0);
  gl.uniform3f(U.iResolution, W, H, 1);
  gl.uniform1f(U.iTime, ctx.time);
  gl.uniform1f(U.iTimeDelta, ctx.dt);
  gl.uniform1i(U.iFrame, ctx.frame);
  gl.uniform1f(U.iFrameRate, ctx.s.fps);
  gl.uniform1f(U.iDuration, ctx.s.dur);
  const mz = mouse.cx * W, mw = mouse.cy * H;
  gl.uniform4f(U.iMouse, mouse.x * W, mouse.y * H, mouse.down ? mz : -mz, mouse.down ? mw : -mw);
  const d = new Date();
  gl.uniform4f(U.iDate, d.getFullYear(), d.getMonth(), d.getDate(), d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds());
  const res = new Float32Array(12);
  res[0] = W; res[1] = H; res[2] = 1;
  gl.uniform3fv(U.iChannelResolution, res);
  gl.uniform1i(U._alphaMode, l.alphaMode);
  drawTo(fb);
  bindTex(0, null);
}

/** 加工を順にかける。src は所有権ごと受け取り、結果のターゲットを返す */
function applyFx(n, src, ctx) {
  const f = n.fx;
  if (!fxActive(f)) return src;
  const W = canvas.width, H = canvas.height;
  const pass = (prog, setU) => {
    const out = acquire();
    gl.useProgram(prog.prog);
    bindTex(0, src.tex);
    gl.uniform1i(prog.u.uSrc, 0);
    setU(prog.u);
    drawTo(out.fb);
    bindTex(0, null);
    release(src);
    src = out;
  };
  if (fxColorActive(f)) pass(P.fxc, u => {
    gl.uniform1i(u.uKey, f.key === 'white' ? 1 : f.key === 'black' ? 2 : 0);
    gl.uniform1i(u.uColorOn, f.colorOn ? 1 : 0);
    gl.uniform3f(u.uColor, ...hex2rgb(f.color));
    gl.uniform1f(u.uBright, f.bright / 200);
    gl.uniform1f(u.uContrast, f.contrast >= 0 ? 1 / (1 - f.contrast / 100 * 0.95) : 1 + f.contrast / 100);
    gl.uniform1f(u.uHue, f.hue);
    gl.uniform1f(u.uSat, f.sat / 100);
    gl.uniform1f(u.uLight, f.light / 100);
    gl.uniform1i(u.uInvert, f.invert ? 1 : 0);
    gl.uniform1f(u.uPoster, f.posterize >= 2 ? f.posterize : 0);
  });
  if (f.outline > 0) pass(P.outline, u => {
    gl.uniform2f(u.uSize, W, H);
    gl.uniform1f(u.uR, f.outline * ctx.ps);
    gl.uniform3f(u.uCol, ...hex2rgb(f.outlineColor));
  });
  if (f.blur > 0) {
    const sigma = Math.max(0.3, f.blur * ctx.ps / 2);
    for (const dir of [[1, 0], [0, 1]]) pass(P.blur, u => {
      gl.uniform2f(u.uSize, W, H);
      gl.uniform2f(u.uDir, dir[0], dir[1]);
      gl.uniform1f(u.uSigma, sigma);
    });
  }
  return src;
}

/** ノードの中身（加工済み）を新しいターゲットに描いて返す */
function nodeTexture(n, belowTex, ctx) {
  if (n.type === 'folder') return applyFx(n, composeList(n.children, acquireCleared(), ctx), ctx);
  const t = acquire();
  renderContent(n, t.fb, belowTex, ctx);
  return applyFx(n, t, ctx);
}

function composite(baseTex, layerTex, opacity, blend, outFb, clip) {
  gl.useProgram(P.comp.prog);
  bindTex(0, baseTex);
  bindTex(1, layerTex);
  gl.uniform1i(P.comp.u.uBase, 0);
  gl.uniform1i(P.comp.u.uLayer, 1);
  gl.uniform1f(P.comp.u.uOpacity, opacity);
  gl.uniform1i(P.comp.u.uMode, BLEND_ID[blend === 'through' ? 'normal' : blend] ?? 0);
  gl.uniform1i(P.comp.u.uClip, clip ? 1 : 0);
  drawTo(outFb);
  unbindAll();
}

/** list を acc の上に重ねていく（acc の所有権を受け取り、新しい acc を返す） */
function composeList(list, acc, ctx) {
  let i = 0;
  while (i < list.length) {
    const base = list[i];
    const clipped = [];
    let j = i + 1;
    while (j < list.length && list[j].clip) clipped.push(list[j++]);
    i = j;
    if (!nodeShown(base)) continue;          // 下地が非表示ならクリッピングも非表示
    const vis = clipped.filter(nodeShown);
    // 通過フォルダ：中身をそのまま今の重なりに合成する
    if (base.type === 'folder' && base.blend === 'through' && base.opacity >= 1 && !vis.length && !fxActive(base.fx)) {
      acc = composeList(base.children, acc, ctx);
      continue;
    }
    let g = nodeTexture(base, acc.tex, ctx);
    for (const c of vis) {
      const ct = nodeTexture(c, g.tex, ctx);
      const out = acquire();
      composite(g.tex, ct.tex, c.opacity, c.blend, out.fb, true);
      release(ct); release(g);
      g = out;
    }
    const out = acquire();
    composite(acc.tex, g.tex, base.opacity, base.blend, out.fb, false);
    release(g); release(acc);
    acc = out;
  }
  return acc;
}

function render(time, frame, dt) {
  const s = S();
  const W = canvas.width, H = canvas.height;
  ensurePool(W, H);
  for (const n of allNodes()) if (n.type === 'paint' && n.texDirty) { uploadTexture(n, n.canvas); n.texDirty = false; }
  const ctx = { time, frame, dt, s, ps: W / s.w };
  const acc = composeList(root, acquireCleared(), ctx);
  gl.useProgram(P.final.prog);
  bindTex(0, acc.tex);
  gl.uniform1i(P.final.u.uSrc, 0);
  gl.uniform1i(P.final.u.uBlack, s.blackBg ? 1 : 0);
  drawTo(null);
  unbindAll();
  release(acc);
}

/* ---------- playback ---------- */
let playing = true, elapsed = 0, last = performance.now(), frameCounter = 0;
let dirty = true, exporting = false, scrubbing = false;

function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!exporting) {
    const s = S();
    if (playing && !scrubbing) {
      elapsed += dt;
      if ($('#loop').checked) elapsed = ((elapsed % s.dur) + s.dur) % s.dur;
    }
    if (playing || dirty) {
      render(s.start + elapsed, frameCounter++, dt);
      dirty = false;
      $('#scrub').value = Math.min(elapsed, s.dur);
      $('#timeText').textContent = `${(s.start + elapsed).toFixed(3)}s / f${Math.floor(elapsed * s.fps + 1e-6)}`;
    }
    drawOverlay();
  }
  requestAnimationFrame(tick);
}
$('#btnPlay').addEventListener('click', () => {
  playing = !playing;
  $('#btnPlay').textContent = playing ? '一時停止' : '再生';
});
$('#scrub').addEventListener('input', () => { elapsed = +$('#scrub').value; dirty = true; });
$('#scrub').addEventListener('pointerdown', () => { scrubbing = true; });
window.addEventListener('pointerup', () => { scrubbing = false; });

/* ================================================================
   Export
   ================================================================ */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
/** 無圧縮(store)ZIP */
class ZipSink {
  constructor() {
    this.parts = []; this.central = []; this.offset = 0; this.cdSize = 0; this.count = 0;
    const d = new Date();
    this.time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    this.date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  }
  async add(name, blob) {
    const data = new Uint8Array(await blob.arrayBuffer());
    const crc = crc32(data), size = data.length;
    const nb = new TextEncoder().encode(name);
    if (this.offset + 30 + nb.length + size > 0xFFFFFFFF)
      throw new Error('ZIPが4GBを超えます。「フォルダへ書き出し」を使ってください');
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, this.time, true); lh.setUint16(12, this.date, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, nb.length, true); lh.setUint16(28, 0, true);
    this.parts.push(lh, nb, blob);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, this.time, true);
    ch.setUint16(14, this.date, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true);
    ch.setUint32(24, size, true); ch.setUint16(28, nb.length, true); ch.setUint16(30, 0, true);
    ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, this.offset, true);
    this.central.push(ch, nb);
    this.offset += 30 + nb.length + size;
    this.cdSize += 46 + nb.length;
    this.count++;
  }
  build() {
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(4, 0, true); end.setUint16(6, 0, true);
    end.setUint16(8, this.count, true); end.setUint16(10, this.count, true);
    end.setUint32(12, this.cdSize, true); end.setUint32(16, this.offset, true); end.setUint16(20, 0, true);
    return new Blob([...this.parts, ...this.central, end], { type: 'application/zip' });
  }
  async finish(zipName) { download(this.build(), zipName); }
}
class DirSink {
  constructor(dir) { this.dir = dir; }
  async add(name, blob) {
    const fh = await this.dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(blob);
    await w.close();
  }
  async finish() {}
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
const canvasBlob = () => new Promise((res, rej) =>
  canvas.toBlob(b => b ? res(b) : rej(new Error('PNGの生成に失敗しました（解像度が大きすぎる可能性があります）')), 'image/png'));

let cancelReq = false;
function setBusy(b) {
  exporting = b;
  ['#btnStill', '#btnZip', '#btnDir'].forEach(id => { $(id).disabled = b || (id === '#btnDir' && !window.showDirectoryPicker); });
  $('#btnCancel').hidden = !b;
}
function setStatus(t) { $('#status').textContent = t; }
function setProgress(r) { $('#bar').style.width = (r * 100).toFixed(1) + '%'; }

async function exportStill() {
  const s = S();
  setBusy(true);
  try {
    applyResolution(1);
    const t = s.start + elapsed;
    render(t, Math.floor(elapsed * s.fps), 1 / s.fps);
    download(await canvasBlob(), `${s.prefix}t${t.toFixed(3)}.png`);
    setStatus(`PNGを書き出しました（${s.w}×${s.h}）`);
  } catch (e) {
    setStatus('エラー: ' + e.message);
  } finally {
    applyResolution();
    setBusy(false);
  }
}
async function exportSequence(kind) {
  const s = S();
  const n = frameCountOf(s);
  let sink;
  if (kind === 'dir') {
    try { sink = new DirSink(await window.showDirectoryPicker({ mode: 'readwrite' })); }
    catch (e) { if (e.name !== 'AbortError') setStatus('エラー: ' + e.message); return; }
  } else sink = new ZipSink();

  const pad = Math.max(4, String(n - 1).length);
  cancelReq = false;
  setBusy(true);
  setProgress(0);
  const t0 = performance.now();
  try {
    applyResolution(1);
    for (let i = 0; i < n; i++) {
      if (cancelReq) break;
      render(s.start + i / s.fps, i, 1 / s.fps);
      await sink.add(`${s.prefix}${String(i).padStart(pad, '0')}.png`, await canvasBlob());
      setProgress((i + 1) / n);
      setStatus(`${i + 1} / ${n}`);
      if (i % 3 === 2) await new Promise(r => setTimeout(r, 0));
    }
    if (cancelReq) setStatus('中止しました');
    else {
      if (kind === 'zip') setStatus('ZIPを作成中…');
      const base = s.prefix.replace(/[_\-.\s]+$/, '') || 'frames';
      await sink.finish(`${base}_${s.w}x${s.h}_${s.fps}fps_${n}f.zip`);
      setStatus(`完了：${n}フレーム（${((performance.now() - t0) / 1000).toFixed(1)}秒）`);
    }
  } catch (e) {
    setStatus('エラー: ' + e.message);
  } finally {
    applyResolution();
    setBusy(false);
  }
}
$('#btnStill').addEventListener('click', exportStill);
$('#btnZip').addEventListener('click', () => exportSequence('zip'));
$('#btnDir').addEventListener('click', () => exportSequence('dir'));
$('#btnCancel').addEventListener('click', () => { cancelReq = true; });

/* ================================================================
   Persistence（設定とGLSL → localStorage / 画像・描画・最近のプロジェクト → IndexedDB）
   ================================================================ */
const idb = (() => {
  let dbp = null;
  const open = () => dbp ??= new Promise((res, rej) => {
    const r = indexedDB.open('glsl-effect-exporter', 2);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('images')) db.createObjectStore('images');
      if (!db.objectStoreNames.contains('recent')) db.createObjectStore('recent');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const run = async (store, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req.result);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    put: (k, v, store = 'images') => run(store, 'readwrite', s => s.put(v, k)),
    get: (k, store = 'images') => run(store, 'readonly', s => s.get(k)),
    del: (k, store = 'images') => run(store, 'readwrite', s => s.delete(k)),
    keys: (store = 'images') => run(store, 'readonly', s => s.getAllKeys()),
    all: (store = 'images') => run(store, 'readonly', s => s.getAll()),
  };
})();

const STORE_KEY = 'glsl-effect-exporter.v3';
const V2_KEY = 'glsl-effect-exporter.v2';
const V1_KEY = 'withgaraku.glsl-exporter.v1';
const SETTING_IDS = ['w','h','fps','dur','start','prefix','pscale','bgMode','bgColor','blackBg','loop','autoCompile','pLock'];
const DEFAULT_SETTINGS = {};
for (const id of SETTING_IDS) { const el = $('#' + id); DEFAULT_SETTINGS[id] = el.type === 'checkbox' ? el.checked : el.value; }
let saveTimer = 0, booting = true;

function serNode(l) {
  const base = { id: l.id, type: l.type, name: l.name, visible: l.visible, opacity: l.opacity,
    blend: l.blend, clip: l.clip, fx: { ...l.fx } };
  const tfm = n => ({ cx: n.cx, cy: n.cy, sx: n.sx, sy: n.sy, rot: n.rot, flipH: n.flipH, flipV: n.flipV, interp: n.interp });
  if (l.type === 'shader') return { ...base, code: l.code, alphaMode: l.alphaMode };
  if (l.type === 'image') return { ...base, ...tfm(l) };
  if (l.type === 'paint') return { ...base, ...tfm(l), pw: l.canvas.width, ph: l.canvas.height };
  return { ...base, open: l.open, children: l.children.map(serNode) };
}
function serializeState() {
  const settings = {};
  for (const id of SETTING_IDS) {
    const el = $('#' + id);
    settings[id] = el.type === 'checkbox' ? el.checked : el.value;
  }
  return { settings, layers: root.map(serNode) };
}
function hashStr(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
// 描画内容の変化も「未保存」に含める
let paintEditCount = 0;
const stateSig = () => hashStr(JSON.stringify(serializeState()) + '|' + paintEditCount);

function scheduleSave() {
  if (booting) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const st = serializeState();
    project.dirty = hashStr(JSON.stringify(st) + '|' + paintEditCount) !== project.sig;
    updateProjLabel();
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ ...st, selId, projName: project.name, projSig: project.sig, paintEdits: paintEditCount }));
    } catch (_) { /* storage unavailable */ }
  }, 300);
}
function applySettings(settings) {
  for (const [k, v] of Object.entries(settings || {})) {
    const el = $('#' + k);
    if (!el || !SETTING_IDS.includes(k)) continue;
    if (el.type === 'checkbox') el.checked = !!v; else el.value = v;
  }
  if ($('#bgMode').selectedIndex < 0) $('#bgMode').value = 'checker-dark';
  if ($('#pscale').selectedIndex < 0) $('#pscale').value = '0.5';
}
async function restoreNodes(list, legacy, blobs) {
  const s = S();
  const out = [];
  for (const d of list || []) {
    if (legacy && d.blend === 'add') d.blend = 'addglow';   // 旧「加算（発光）」
    try {
      if (d.type === 'shader') {
        const l = makeShaderLayer(d);
        compileLayer(l);
        out.push(l);
      } else if (d.type === 'image') {
        const blob = blobs ? blobs.get(d.id) : await idb.get(d.id);
        if (!blob) continue;
        if (blobs) idb.put(d.id, blob).catch(() => {});
        const l = makeImageLayer({ ...d, blob });
        await loadImageLayer(l);
        if (legacy || d.cx === undefined) {           // 旧形式（割合・キャンバスに収まる大きさ基準）
          const k = Math.min(s.w / l.iw, s.h / l.ih) * (d.scale ?? 1);
          Object.assign(l, { cx: (d.x ?? 0.5) * s.w, cy: (d.y ?? 0.5) * s.h, sx: k, sy: k });
        }
        out.push(l);
      } else if (d.type === 'paint') {
        const l = makePaintLayer(d);
        const blob = blobs ? blobs.get(d.id) : await idb.get(d.id);
        if (blob) {
          if (blobs) idb.put(d.id, blob).catch(() => {});
          const bmp = await createImageBitmap(blob);
          l.canvas.getContext('2d').drawImage(bmp, 0, 0);
        }
        out.push(l);
      } else if (d.type === 'folder') {
        const f = makeFolder(d);
        f.children = await restoreNodes(d.children, legacy, blobs);
        out.push(f);
      }
    } catch (_) { /* 読めないレイヤーは飛ばす */ }
  }
  return out;
}
async function restore() {
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } };
  let data = read(STORE_KEY), legacy = false;
  if (!data) { data = read(V2_KEY); legacy = !!data; }
  if (data) {
    if (!legacy) { project.name = data.projName || '無題'; project.sig = data.projSig ?? null; paintEditCount = data.paintEdits || 0; }
    applySettings(data.settings);
    root = await restoreNodes(data.layers, legacy, null);
    return byId(data.selId) ? data.selId : (root.at(-1)?.id ?? null);
  }
  const old = read(V1_KEY);
  if (old && typeof old.code === 'string') {
    const { alphaMode, ...rest } = old.settings || {};
    applySettings(rest);
    const l = makeShaderLayer({ code: old.code, alphaMode: +alphaMode || 0 });
    compileLayer(l);
    root = [l];
    return l.id;
  }
  return null;
}
async function cleanupImages() {
  try {
    const live = new Set(allNodes().map(l => l.id));
    for (const k of await idb.keys()) if (!live.has(k)) await idb.del(k);
  } catch (_) {}
}

  document.title = `${project.dirty ? '● ' : ''}${project.name} — GLSL Effect Exporter`;
}

async function readZip(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('プロジェクトファイルとして読み込めませんでした');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder(), out = new Map();
  for (let i = 0; i < count; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('ファイルが壊れています');
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const loff = dv.getUint32(p + 42, true);
    const name = dec.decode(buf.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + elen + clen;
    const start = loff + 30 + dv.getUint16(loff + 26, true) + dv.getUint16(loff + 28, true);
    let data = buf.subarray(start, start + csize);
    if (method === 8) {
      data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    } else if (method !== 0) throw new Error('未対応の圧縮形式です');
    if (!name.endsWith('/')) out.set(name, data);
  }
  return out;
}

function makeThumb() {
  try {
    const t = document.createElement('canvas');
    const k = Math.min(240 / canvas.width, 140 / canvas.height);
    t.width = Math.max(1, Math.round(canvas.width * k));
    t.height = Math.max(1, Math.round(canvas.height * k));
    const c = t.getContext('2d');
    c.fillStyle = '#2b2d33'; c.fillRect(0, 0, t.width, t.height);
    render(S().start + elapsed, 0, 0);
    c.drawImage(canvas, 0, 0, t.width, t.height);
    return t.toDataURL('image/jpeg', 0.8);
  } catch (_) { return ''; }
}

async function buildProjectBlob() {
  const st = serializeState();
  const meta = { format: 'glsl-effect-exporter', version: 2, savedAt: new Date().toISOString(), ...st, selId };
  const byIdSer = new Map();
  const walkSer = list => { for (const d of list) { byIdSer.set(d.id, d); if (d.children) walkSer(d.children); } };
  walkSer(meta.layers);
  const files = [];
  for (const l of allNodes()) {
    if (l.type === 'image') {
      const ext = ((l.blob.type || '').split('/')[1] || 'png').replace('jpeg', 'jpg').replace(/[^a-z0-9]/g, '') || 'png';
      const path = `images/${l.id}.${ext}`;
      byIdSer.get(l.id).file = path;
      files.push([path, l.blob]);
    } else if (l.type === 'paint') {
      const path = `paint/${l.id}.png`;
      byIdSer.get(l.id).file = path;
      files.push([path, await canvasToBlob(l.canvas)]);
    }
  }
  const zip = new ZipSink();
  await zip.add('project.json', new Blob([JSON.stringify(meta, null, 2)], { type: 'application/json' }));
  for (const [path, blob] of files) await zip.add(path, blob);
  return { blob: zip.build(), st };
}

async function saveProject(saveAs) {
  try {
    const { blob, st } = await buildProjectBlob();
    if (window.showSaveFilePicker) {
      if (saveAs || !project.handle) {
        project.handle = await window.showSaveFilePicker({ suggestedName: project.name + PROJECT_EXT, types: PROJECT_TYPES });
      }
      const w = await project.handle.createWritable();
      await w.write(blob);
      await w.close();
      project.name = project.handle.name.replace(/\.glslfx$/i, '');
    } else {
      if (saveAs || project.name === '無題') {
        const n = prompt('プロジェクト名', project.name);
        if (!n || !n.trim()) return;
        project.name = n.trim().replace(/[\\/:*?"<>|]/g, '_');
      }
      download(blob, project.name + PROJECT_EXT);
    }
    paintEditCount = 0;
    project.sig = hashStr(JSON.stringify(st) + '|0');
    project.dirty = false;
    updateProjLabel();
    scheduleSave();
    addRecent(project.name, blob, project.handle);
    setStatus(`「${project.name}」を保存しました`);
  } catch (e) {
    if (e.name !== 'AbortError') setStatus('保存できませんでした: ' + e.message);
  }
}

function disposeAll() {
  for (const l of allNodes()) {
    if (l.tex) gl.deleteTexture(l.tex);
    if (l.url) URL.revokeObjectURL(l.url);
    if (l.prog) gl.deleteProgram(l.prog);
  }
  root = [];
  hist.undo = []; hist.redo = []; hist.key = null;
}

async function loadProjectState(meta, blobs, name, handle) {
  booting = true;
  try {
    disposeAll();
    applySettings(DEFAULT_SETTINGS);
    let first = null;
    if (meta) {
      applySettings(meta.settings);
      root = await restoreNodes(meta.layers, false, blobs);
      first = byId(meta.selId) ? meta.selId : (root.at(-1)?.id ?? null);
    } else {
      const p = PRESETS[0];
      const l = makeShaderLayer({ name: p.name, code: p.code, alphaMode: p.alphaMode, blend: p.blend });
      compileLayer(l);
      root = [l];
      first = l.id;
    }
    applyBg();
    onSettingsChange();
    fitView();
    elapsed = 0;
    selectLayer(first);
  } finally {
    booting = false;
  }
  project.name = name;
  project.handle = handle || null;
  paintEditCount = 0;
  project.sig = stateSig();
  project.dirty = false;
  updateProjLabel();
  updateUndoButtons();
  scheduleSave();
  cleanupImages();
}

async function openProject(file, handle) {
  try {
    const entries = await readZip(file);
    const json = entries.get('project.json');
    if (!json) throw new Error('project.json が見つかりません');
    const meta = JSON.parse(new TextDecoder().decode(json));
    if (meta.format !== 'glsl-effect-exporter') throw new Error('このツールのプロジェクトファイルではありません');
    const blobs = new Map();
    const walkSer = list => {
      for (const d of list || []) {
        if (d.children) walkSer(d.children);
        if (!d.file || !entries.has(d.file)) continue;
        const ext = d.file.split('.').pop().toLowerCase();
        blobs.set(d.id, new Blob([entries.get(d.file)], { type: MIME[ext] || 'image/png' }));
      }
    };
    walkSer(meta.layers);
    const name = file.name.replace(/\.glslfx$/i, '');
    await loadProjectState(meta, blobs, name, handle);
    addRecent(name, file, handle);
    setStatus(`「${project.name}」を開きました`);
    return true;
  } catch (e) {
    setStatus('開けませんでした: ' + e.message);
    return false;
  }
}

const confirmDiscard = () => !project.dirty || confirm('保存していない変更があります。破棄してよろしいですか？');
async function pickAndOpenProject() {
  if (!confirmDiscard()) return;
  if (window.showOpenFilePicker) {
    try {
      const [h] = await window.showOpenFilePicker({ types: PROJECT_TYPES });
      await openProject(await h.getFile(), h);
    } catch (e) { if (e.name !== 'AbortError') setStatus('開けませんでした: ' + e.message); }
  } else $('#projOpen').click();
}
$('#projOpenBtn').addEventListener('click', pickAndOpenProject);
$('#projOpen').addEventListener('change', e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (f) openProject(f, null);
});
$('#projSave').addEventListener('click', () => saveProject(false));
$('#projSaveAs').addEventListener('click', () => saveProject(true));
$('#projNew').addEventListener('click', () => {
  if (!confirmDiscard()) return;
  loadProjectState(null, null, '無題', null);
  setStatus('新しいプロジェクトを作りました');
});
window.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.code === 'KeyS') { e.preventDefault(); e.stopImmediatePropagation(); saveProject(e.shiftKey); }
  else if (mod && e.code === 'KeyO') { e.preventDefault(); e.stopImmediatePropagation(); pickAndOpenProject(); }
}, true);

/* ---------- 最近使ったプロジェクト ---------- */
const RECENT_MAX = 12;
async function addRecent(name, blob, handle) {
  try {
    const list = await idb.all('recent');
    let hit = null;
    for (const r of list) {
      if (handle && r.handle) { try { if (await r.handle.isSameEntry(handle)) { hit = r; break; } } catch (_) {} }
      else if (!handle && !r.handle && r.name === name) { hit = r; break; }
    }
    const id = hit ? hit.id : 'R' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await idb.put(id, { id, name, time: Date.now(), thumb: makeThumb(), handle: handle || null, blob, size: blob.size }, 'recent');
    const all = (await idb.all('recent')).sort((a, b) => b.time - a.time);
    for (const r of all.slice(RECENT_MAX)) await idb.del(r.id, 'recent');
  } catch (_) { /* 最近の一覧は保存できなくても動作には影響しない */ }
}
async function openRecent(r) {
  if (!confirmDiscard()) return;
  hideRecent();
  let file = null, handle = null;
  if (r.handle) {
    try {
      let perm = await r.handle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') perm = await r.handle.requestPermission({ mode: 'readwrite' });
      if (perm === 'granted') { file = await r.handle.getFile(); handle = r.handle; }
    } catch (_) {}
  }
  let fromCopy = false;
  if (!file) { file = new File([r.blob], r.name + PROJECT_EXT); fromCopy = true; }
  const ok = await openProject(file, handle);
  if (ok && fromCopy && r.handle) setStatus(`元のファイルが開けなかったため、最後に保存したときのコピーから「${r.name}」を開きました`);
}
function fmtDate(t) {
  const d = new Date(t), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
async function showRecent() {
  const pop = $('#recentPop');
  let list = [];
  try { list = (await idb.all('recent')).sort((a, b) => b.time - a.time); } catch (_) {}
  pop.innerHTML = '';
  if (!list.length) pop.innerHTML = '<div class="empty">まだありません。プロジェクトを保存したり開いたりすると、ここに並びます。</div>';
  for (const r of list) {
    const item = document.createElement('div');
    item.className = 'recent-item';
    const img = document.createElement('img');
    if (r.thumb) img.src = r.thumb;
    const info = document.createElement('div');
    info.className = 'ri';
    info.innerHTML = '<div class="rn"></div><div class="rd"></div>';
    info.querySelector('.rn').textContent = r.name;
    info.querySelector('.rd').textContent = `${fmtDate(r.time)}　${(r.size / 1024 / 1024).toFixed(1)}MB${r.handle ? '' : '（コピー）'}`;
    const x = document.createElement('button');
    x.className = 'rx';
    x.textContent = '×';
    x.title = '一覧から外す（ファイルは消えません）';
    x.addEventListener('click', async e => { e.stopPropagation(); await idb.del(r.id, 'recent'); showRecent(); });
    item.append(img, info, x);
    item.addEventListener('click', () => openRecent(r));
    pop.appendChild(item);
  }
  const b = $('#projRecentBtn').getBoundingClientRect();
  pop.hidden = false;
  const h = pop.offsetHeight;
  pop.style.left = Math.min(b.left, window.innerWidth - 370) + 'px';
  pop.style.top = (b.top - h - 6 > 8 ? b.top - h - 6 : b.bottom + 6) + 'px';
}
function hideRecent() { $('#recentPop').hidden = true; }
$('#projRecentBtn').addEventListener('click', e => {
  e.stopPropagation();
  if ($('#recentPop').hidden) showRecent(); else hideRecent();
});
document.addEventListener('pointerdown', e => {
  if (!$('#recentPop').hidden && !e.target.closest('#recentPop,#projRecentBtn')) hideRecent();
});
window.addEventListener('keydown', e => { if (e.key === 'Escape') hideRecent(); });

/* ================================================================
   Boot
   ================================================================ */
(async () => {
  if (!gl) {
    log.textContent = 'このブラウザでは WebGL2 が使えません。最新の Chrome / Edge / Firefox / Safari で開いてください。';
    log.className = 'log err';
    return;
  }
  initGL();
  loadUI();
  let first = await restore();
  if (!root.length && first === null) {
    const p = PRESETS[0];
    const l = makeShaderLayer({ name: p.name, code: p.code, alphaMode: p.alphaMode, blend: p.blend });
    compileLayer(l);
    root = [l];
    first = l.id;
  }
  applyBg();
  onSettingsChange();
  selectLayer(first);
  setTool(Object.values(TOOL_KEYS).includes(ui.tool) ? ui.tool : 'move');
  updateUndoButtons();
  if (!window.showDirectoryPicker) {
    $('#btnDir').disabled = true;
    $('#btnDir').title = 'このブラウザは未対応です（Chrome / Edge で使えます）';
  }
  booting = false;
  if (project.sig === null) project.sig = stateSig();
  updateProjLabel();
  scheduleSave();
  cleanupImages();
  requestAnimationFrame(tick);
})();
