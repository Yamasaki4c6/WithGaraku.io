<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLSL Effect Exporter</title>
<style>
:root{
  --bg:#131418; --panel:#1b1d22; --panel2:#22252b; --line:#2e3239;
  --text:#e8e8eb; --muted:#9296a0; --accent:#f2b45c; --accent2:#7cc7ff;
  --err:#ff6b6b; --ok:#7bd88f; --sel:#2a303b; --clip:#e0567a;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Noto Sans Mono", monospace;
  --edw: 36%;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:13px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:var(--edw) 6px minmax(0,1fr);height:100vh}
.app.collapsed .editor-col{visibility:hidden}
.splitter{cursor:col-resize;background:var(--line);position:relative;touch-action:none}
.splitter:hover,.splitter.drag{background:var(--accent)}
.splitter::after{content:'';position:absolute;inset:0 -4px}
@media (max-width:1100px){.app{grid-template-columns:1fr!important;height:auto}.splitter{display:none}.editor-col{height:60vh}.right-col{height:100vh}}

/* ---------- editor ---------- */
.editor-col{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;background:var(--panel)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.editing{color:var(--muted);font-size:12px;margin-left:auto;max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code-wrap{flex:1;display:flex;min-height:0;font:12.5px/1.6 var(--mono)}
.gutter{padding:10px 8px 10px 0;min-width:44px;text-align:right;color:#5b606b;background:#17191d;
  overflow:hidden;white-space:pre;user-select:none;border-right:1px solid var(--line)}
.gutter .e{color:#fff;background:var(--err);border-radius:3px;padding:0 3px}
textarea#code{flex:1;resize:none;border:0;outline:0;margin:0;padding:10px 12px;background:transparent;color:var(--text);
  font:inherit;white-space:pre;overflow:auto;tab-size:2}
textarea#code:disabled{color:var(--muted)}
.log{max-height:28%;overflow:auto;border-top:1px solid var(--line);padding:6px 10px;font:12px/1.5 var(--mono);white-space:pre-wrap;min-height:2.2em}
.log.ok{color:var(--ok)} .log.err{color:var(--err)} .log.info{color:var(--muted)}

/* ---------- right column ---------- */
.right-col{display:flex;flex-direction:column;min-height:0;min-width:0}
.stage-row{flex:1;display:flex;min-height:320px}
.preview{flex:1;min-width:0;position:relative;overflow:hidden;background:#101114}
.preview.dropping::after{content:'';position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:8px;pointer-events:none}
.stage{position:absolute;box-shadow:0 0 0 1px var(--line),0 8px 30px #0008}
.stage canvas{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.zoom-chip{position:absolute;left:10px;bottom:8px;font:11px var(--mono);color:var(--muted);background:#0009;
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;cursor:pointer}
.bg-checker-dark{background:conic-gradient(#2b2d33 25%,#3a3d44 0 50%,#2b2d33 0 75%,#3a3d44 0) 0 0/20px 20px}
.bg-checker-light{background:conic-gradient(#cfcfd4 25%,#fff 0 50%,#cfcfd4 0 75%,#fff 0) 0 0/20px 20px}

/* ---------- tools ---------- */
.toolbar{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:3px;background:#1b1d22ee;
  border:1px solid var(--line);border-radius:8px;padding:4px}
.toolbar button{width:30px;height:30px;padding:0;display:grid;place-items:center;border-color:transparent;background:none;color:var(--muted)}
.toolbar button:hover{color:var(--text);border-color:var(--line)}
.toolbar button.on{background:var(--accent);color:#1b1407}
.toolbar svg{width:17px;height:17px}
.toolopts{position:absolute;left:52px;top:8px;right:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;pointer-events:none}
.toolopts > *{pointer-events:auto}
.toolopts .opt{display:flex;align-items:center;gap:6px;background:#1b1d22ee;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;color:var(--muted)}
.toolopts input[type=range]{width:90px;min-width:0;flex:none}
.toolopts input[type=number]{width:4em}

/* ---------- layers ---------- */
.layers{width:330px;flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-height:0}
.layers-head{display:flex;align-items:center;gap:5px;padding:8px 10px;border-bottom:1px solid var(--line)}
.layers-head b{margin-right:auto;font-weight:600;white-space:nowrap}
.layers-head button{padding:2px 6px;font-size:12px;white-space:nowrap}
#layerList{list-style:none;margin:0;padding:0;overflow:auto;flex:1 1 140px;min-height:100px}
#layerList li{--ind:0px;position:relative;display:flex;align-items:center;gap:7px;padding:5px 8px 5px calc(8px + var(--ind));
  border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent;user-select:none}
#layerList li:hover{background:#20232a}
#layerList li.sel{background:var(--sel);border-left-color:var(--accent)}
#layerList li.off .lname,#layerList li.off .thumb,#layerList li.hiddenByParent .lname{opacity:.4}
#layerList li.clip .thumb{margin-left:12px}
#layerList li.clip::before{content:'';position:absolute;left:calc(40px + var(--ind));top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--clip)}
#layerList li.drop-above{box-shadow:inset 0 2px 0 var(--accent)}
#layerList li.drop-below{box-shadow:inset 0 -2px 0 var(--accent)}
#layerList li.drop-into{background:#f2b45c26;outline:1px solid var(--accent);outline-offset:-1px}
#layerList li.empty{color:var(--muted);cursor:default;font-size:12px;line-height:1.7;border:0;padding:14px 12px}
.eye,.caret{background:none;border:0;padding:2px;width:22px;height:22px;display:grid;place-items:center;color:var(--muted);flex:none}
.caret{width:14px;margin-right:-4px}
.eye:hover,.caret:hover{color:var(--text)}
.eye svg{width:16px;height:16px}
.thumb{width:38px;height:26px;flex:none;border-radius:4px;display:grid;place-items:center;overflow:hidden;
  background:conic-gradient(#2b2d33 25%,#3a3d44 0 50%,#2b2d33 0 75%,#3a3d44 0) 0 0/8px 8px}
.thumb img,.thumb canvas{width:100%;height:100%;object-fit:contain}
.thumb.glsl{background:#2a2333;color:#d6b4ff;font:600 9.5px var(--mono);letter-spacing:.04em}
.thumb.folder{background:none;color:#e9c46a}
.thumb.folder svg{width:22px;height:22px}
.lname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmeta{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.errdot{width:8px;height:8px;border-radius:50%;background:var(--err);flex:none}
.layer-tools{display:flex;gap:5px;padding:6px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.layer-tools button{font-size:12px;padding:3px 7px}
.layer-tools button.on{background:var(--clip);border-color:var(--clip);color:#fff}
.layer-tools .sp{flex:1}
.props{overflow:auto;flex:0 1 auto;max-height:58%;padding:6px 10px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.props details{border:1px solid var(--line);border-radius:7px;padding:4px 8px 6px;background:#1f2126}
.props summary{cursor:pointer;color:var(--accent2);font-size:12px;padding:2px 0}
.props details > .prow{margin-top:5px}
.prow{display:flex;align-items:center;gap:6px;min-width:0}
.prow > span:first-child{color:var(--muted);width:5em;flex:none;font-size:12px}
.prow input[type=range]{min-width:40px;flex:1}
.prow input[type=number]{width:4.8em;flex:none}
.prow select{flex:1;min-width:0}
.prow.btns{flex-wrap:wrap}
.prow.btns button{font-size:12px;padding:3px 7px}
.prow label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}

/* ---------- bottom panel ---------- */
.panel{border-top:1px solid var(--line);background:var(--panel);padding:10px 12px;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row > .label{color:var(--muted);min-width:4.5em}
.group{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.group span{color:var(--muted)}
input[type=number],input[type=text],select{background:#121317;border:1px solid var(--line);border-radius:6px;padding:3px 6px;outline:0}
input[type=number]{width:5.2em}
input[type=number]:focus,input[type=text]:focus,select:focus{border-color:var(--accent)}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
input[type=color]{width:30px;height:24px;border:0;background:none;padding:0;flex:none}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:#4a4f59}
button.primary{background:var(--accent);border-color:var(--accent);color:#1b1407;font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:not-allowed}
.time{font:12px var(--mono);color:var(--muted);min-width:11em}
.hint{color:var(--muted);font-size:12px}
.progress{height:6px;background:#121317;border-radius:3px;overflow:hidden;flex:1;min-width:120px}
.progress > i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.file-label{position:relative;overflow:hidden}
.file-label input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ---------- recent projects ---------- */
.recent-pop{position:fixed;z-index:20;width:360px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 12px 40px #000a;padding:6px}
.recent-pop .empty{color:var(--muted);padding:14px;font-size:12px}
.recent-item{display:flex;align-items:center;gap:10px;padding:6px;border-radius:7px;cursor:pointer}
.recent-item:hover{background:var(--sel)}
.recent-item img{width:72px;height:42px;object-fit:cover;border-radius:4px;background:#0c0d10;flex:none}
.recent-item .ri{flex:1;min-width:0}
.recent-item .rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-item .rd{color:var(--muted);font-size:11px}
.recent-item .rx{background:none;border:0;color:var(--muted);padding:2px 6px}
.recent-item .rx:hover{color:var(--err)}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ================= Editor ================= -->
  <section class="editor-col">
    <div class="bar">
      <select id="preset" title="選択中のGLSLレイヤーにサンプルを読み込みます">
        <option value="">サンプルを読み込む…</option>
      </select>
      <button id="btnCompile" title="Ctrl/⌘ + Enter">コンパイル</button>
      <label class="hint"><input type="checkbox" id="autoCompile" checked> 自動</label>
      <button id="btnSave" title="このGLSLレイヤーのコードを .glsl で保存">GLSL保存</button>
      <button class="file-label" title=".glsl / .frag を読み込む">GLSL読込<input type="file" id="fileOpen" accept=".glsl,.frag,.fs,.txt"></button>
      <span class="editing" id="editing"></span>
    </div>
    <div class="code-wrap">
      <div class="gutter" id="gutter">1</div>
      <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    </div>
    <div class="log" id="log"></div>
  </section>

  <div class="splitter" id="splitter" title="ドラッグで幅を変更／ダブルクリックでエディタを開閉"></div>

  <!-- ================= Preview / Layers / Export ================= -->
  <section class="right-col">
    <div class="stage-row">
      <div class="preview" id="preview">
        <div class="stage bg-checker-dark" id="stage"><canvas id="cv"></canvas></div>
        <canvas id="overlay"></canvas>
        <div class="toolbar" id="toolbar">
          <button data-tool="move" title="移動・変形（V）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 8-6 2-2 6z"/></svg></button>
          <button data-tool="pen" title="ペン（P）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l5 5L8 21H3v-5z"/><path d="M13 6l5 5"/></svg></button>
          <button data-tool="eraser" title="消しゴム（E）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8l-5-5 10-10 8 8-6 6"/><path d="M8 10l6 6"/></svg></button>
          <button data-tool="lasso" title="投げ縄（L）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="9" rx="9" ry="6" stroke-dasharray="3 2"/><path d="M7 14c-2 2-1 5 2 6"/></svg></button>
          <button data-tool="hand" title="手のひら（H／Space）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5a1.5 1.5 0 0 1 3 0v6V4a1.5 1.5 0 0 1 3 0v7V6a1.5 1.5 0 0 1 3 0v8c0 4-3 7-7 7-3 0-5-2-6.5-4L4 13a1.5 1.5 0 0 1 2.5-1.5L8 13"/></svg></button>
        </div>
        <div class="toolopts" id="toolopts">
          <div class="opt" data-for="pen lasso"><span>色</span><input type="color" id="brushColor" value="#202020"></div>
          <div class="opt" data-for="pen eraser"><span>サイズ</span><input type="range" id="brushSize" min="1" max="200" step="1" value="8"><input type="number" id="brushSizeN" min="1" max="500" value="8"></div>
          <div class="opt" data-for="pen eraser lasso"><span>不透明度</span><input type="range" id="brushOpacity" min="1" max="100" step="1" value="100"><input type="number" id="brushOpacityN" min="1" max="100" value="100"></div>
          <div class="opt" data-for="pen eraser"><label><input type="checkbox" id="brushPressure" checked>筆圧</label></div>
          <div class="opt" data-for="lasso"><span>投げ縄</span>
            <select id="lassoMode"><option value="fill">囲んで塗りつぶし</option><option value="erase">囲んで消去</option></select></div>
        </div>
        <div class="zoom-chip" id="zoomChip" title="クリックで全体表示（Ctrl/⌘+0）">100%</div>
      </div>

      <aside class="layers">
        <div class="layers-head">
          <b>レイヤー</b>
          <button id="addShader" title="GLSLレイヤーを追加">＋GLSL</button>
          <button class="file-label" title="画像レイヤーを追加（ドロップ・貼り付けでも可）">＋画像<input type="file" id="addImage" accept="image/*" multiple></button>
          <button id="addPaint" title="描画レイヤーを追加（ペン・投げ縄用）">＋描画</button>
          <button id="addFolder" title="フォルダを追加（Ctrl/⌘+G で選択中のレイヤーをフォルダに入れる）">＋フォルダ</button>
        </div>
        <ul id="layerList"></ul>
        <div class="layer-tools">
          <button id="clipBtn" title="下のレイヤーでクリッピング（Ctrl/⌘+Alt+G）">クリッピング</button>
          <span class="sp"></span>
          <button id="undoBtn" title="取り消し（Ctrl/⌘+Z）">↶</button>
          <button id="redoBtn" title="やり直し（Ctrl/⌘+Shift+Z）">↷</button>
          <button id="dupLayer" title="複製">複製</button>
          <button id="delLayer" title="削除（Delete）">削除</button>
        </div>
        <div class="props" id="props" hidden>
          <div class="prow"><span>不透明度</span>
            <input type="range" id="pOpacity" min="0" max="100" step="1">
            <input type="number" id="pOpacityN" min="0" max="100" step="1"></div>
          <div class="prow"><span>合成モード</span><select id="pBlend"><option value="through">通過</option></select></div>
          <div class="prow" data-for="shader"><span>アルファ</span>
            <select id="pAlpha">
              <option value="0">straight — vec4(col, a)</option>
              <option value="1">premultiplied — vec4(col*a, a)</option>
            </select></div>

          <details open data-for="raster">
            <summary>変形</summary>
            <div class="prow"><span>中心 px</span>
              X<input type="number" id="pCX" step="1"> Y<input type="number" id="pCY" step="1"></div>
            <div class="prow"><span>拡大 %</span>
              幅<input type="number" id="pSW" step="1"> 高<input type="number" id="pSH" step="1">
              <label title="縦横比を固定（ドラッグ中は Shift で一時的に切り替え）"><input type="checkbox" id="pLock" checked>固定</label></div>
            <div class="prow"><span>回転 °</span>
              <input type="range" id="pRot" min="-180" max="180" step="1">
              <input type="number" id="pRotN" step="0.1"></div>
            <div class="prow btns">
              <button id="pFlipH">左右反転</button>
              <button id="pFlipV">上下反転</button>
              <button id="pReset" title="等倍・中央・回転なし">リセット</button>
            </div>
            <div class="prow btns">
              <button id="pFitCanvas">キャンバスに合わせる</button>
              <button id="pFitOut" title="出力解像度をこの画像と同じにします">出力サイズを画像に</button>
            </div>
            <div class="prow"><span>補間</span>
              <select id="pInterp">
                <option value="smooth">なめらか</option>
                <option value="nearest">ニアレストネイバー（ドット絵向け）</option>
              </select></div>
          </details>

          <details id="fxBox">
            <summary>加工</summary>
            <div class="prow"><span>抜き</span>
              <select id="fxKey">
                <option value="none">なし</option>
                <option value="white">白抜き（白を透明に）</option>
                <option value="black">黒抜き（黒を透明に）</option>
              </select></div>
            <div class="prow"><span>レイヤーカラー</span>
              <label><input type="checkbox" id="fxColorOn">単色にする</label>
              <input type="color" id="fxColor" value="#3a6df0"></div>
            <div id="fxSliders"></div>
            <div class="prow"><span>反転</span><label><input type="checkbox" id="fxInvert">色を反転</label></div>
            <div class="prow"><span>フチの色</span><input type="color" id="fxOutlineColor" value="#ffffff"></div>
            <div class="prow btns"><button id="fxReset">加工をリセット</button></div>
          </details>
        </div>
      </aside>
    </div>

    <div class="panel">
      <div class="row">
        <span class="label">プロジェクト</span>
        <button id="projNew">新規</button>
        <button id="projOpenBtn" title="Ctrl/⌘+O">開く</button>
        <button id="projRecentBtn" title="最近使ったプロジェクト">最近 ▾</button>
        <input type="file" id="projOpen" accept=".glslfx" hidden>
        <button id="projSave" title="Ctrl/⌘+S">保存</button>
        <button id="projSaveAs" title="Ctrl/⌘+Shift+S">別名で保存</button>
        <span class="hint" id="projName">無題</span>
      </div>
      <div class="row">
        <button id="btnPlay" style="min-width:4.5em">一時停止</button>
        <input type="range" id="scrub" min="0" max="2" step="0.001" value="0">
        <span class="time" id="timeText">0.000s / f0</span>
        <label class="hint"><input type="checkbox" id="loop" checked> ループ</label>
      </div>
      <div class="row">
        <span class="label">出力</span>
        <div class="group"><span>比率</span>
          <select id="ratio"></select>
          <span>長辺</span>
          <select id="longSide"></select>
          <button id="swapWH" title="縦と横を入れ替え" style="padding:1px 7px">⇄</button>
        </div>
        <div class="group"><span>W</span><input type="number" id="w" value="1920" min="1" max="8192">
          <span>H</span><input type="number" id="h" value="1080" min="1" max="8192"></div>
        <div class="group"><span>fps</span><input type="number" id="fps" value="30" min="1" max="240"></div>
        <div class="group"><span>長さ(秒)</span><input type="number" id="dur" value="2" min="0.01" step="0.1"></div>
        <div class="group"><span>開始</span><input type="number" id="start" value="0" step="0.1"></div>
        <span class="hint" id="frameInfo"></span>
      </div>
      <div class="row">
        <span class="label">プレビュー</span>
        <div class="group"><span>背景</span>
          <select id="bgMode">
            <option value="checker-dark">市松（暗）</option>
            <option value="checker-light">市松（明）</option>
            <option value="black">黒</option>
            <option value="white">白</option>
            <option value="color">単色</option>
          </select>
          <input type="color" id="bgColor" value="#6b7a99" hidden>
        </div>
        <div class="group"><span>表示解像度</span>
          <select id="pscale">
            <option value="1">100%</option>
            <option value="0.5" selected>50%</option>
            <option value="0.25">25%</option>
          </select>
        </div>
        <label class="group" title="アルファを捨て、黒背景に合成した不透明PNGを書き出します（加算・スクリーン用）">
          <input type="checkbox" id="blackBg"> 黒背景で書き出す
        </label>

<script>
'use strict';
const $ = s => document.querySelector(s);

/* ================================================================
   Presets
   ================================================================ */
const PRESETS = [
{
  name: '衝撃波リング', alphaMode: 0, blend: 'normal',
  code: `// 衝撃波リング — straight アルファ: fragColor = vec4(色, 不透明度)
// iDuration（長さ）で1回広がって消えます

void mainImage(out vec4 fragColor, in vec2 fragCoord)
{
    vec2 uv = (fragCoord - 0.5 * iResolution.xy) / iResolution.y;
    float t = fract(iTime / iDuration);          // 0→1 を繰り返す

    float ang = atan(uv.y, uv.x);
    float r = length(uv);
    float radius = mix(0.02, 0.48, 1.0 - pow(1.0 - t, 3.0));
    radius += 0.008 * sin(ang * 14.0 + t * 20.0); // 縁のゆらぎ

    float width = mix(0.01, 0.06, t);
    float ring = smoothstep(width, 0.0, abs(r - radius));
    float inner = smoothstep(radius, 0.0, r) * 0.15; // 内側のうっすらした面
    float fade = pow(1.0 - t, 1.5);

    vec3 col = mix(vec3(0.55, 0.85, 1.0), vec3(1.0), ring);
    float a = clamp((ring + inner) * fade, 0.0, 1.0);

    fragColor = vec4(col, a);
}
`},
{
  name: '光の粒', alphaMode: 1, blend: 'addglow',
  code: `// 光の粒 — 光を足し算で重ねるので premultiplied で書いています
// レイヤーの合成を「加算（発光）」にすると下の絵を明るく照らします

float hash(float n) { return fract(sin(n) * 43758.5453); }

void mainImage(out vec4 fragColor, in vec2 fragCoord)
{
    vec2 uv = (fragCoord - 0.5 * iResolution.xy) / iResolution.y;
    float aspect = iResolution.x / iResolution.y;
    float loopT = iTime / iDuration;               // 整数倍で動かすとループが繋がる

    vec3 col = vec3(0.0);
    for (int i = 0; i < 70; i++) {
        float fi = float(i);
        float cycles = 1.0 + floor(hash(fi * 3.7) * 2.0);
        float y = fract(hash(fi * 1.3) + loopT * cycles);
        float phase = 6.2831853 * (loopT * cycles + hash(fi * 2.9));
        vec2 p = vec2((hash(fi * 5.1) - 0.5) * aspect + 0.03 * sin(phase),
                      mix(-0.6, 0.6, y));

        float d = length(uv - p);
        float size = mix(0.00008, 0.0004, hash(fi * 8.3));
        float g = size / (d * d + size) * smoothstep(0.12, 0.0, d);
        float twinkle = 0.55 + 0.45 * sin(phase * 3.0 + fi);
        float fade = smoothstep(0.0, 0.15, y) * smoothstep(1.0, 0.7, y);

        vec3 tint = mix(vec3(1.0, 0.72, 0.32), vec3(0.55, 0.85, 1.0), hash(fi * 9.3));
        col += tint * g * twinkle * fade;
    }

    float a = clamp(max(col.r, max(col.g, col.b)), 0.0, 1.0);
    fragColor = vec4(col, a);   // premultiplied: 色にはすでにアルファ分が含まれている
}
`},
{
  name: '墨・煙', alphaMode: 0, blend: 'normal',
  code: `// 墨・煙 — 不透明感のあるものは straight アルファで
// ノイズ空間を円周上で動かしてループさせています

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float noise(vec2 p)
{
    vec2 i = floor(p), f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i),                 hash(i + vec2(1.0, 0.0)), u.x),
               mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}

float fbm(vec2 p)
{
    float v = 0.0, amp = 0.5;
    for (int i = 0; i < 5; i++) {
        v += amp * noise(p);
        p = p * 2.03 + vec2(1.7, 9.2);
        amp *= 0.5;
    }
    return v;
}

void mainImage(out vec4 fragColor, in vec2 fragCoord)
{
    vec2 uv = (fragCoord - 0.5 * iResolution.xy) / iResolution.y;
    float ph = 6.2831853 * iTime / iDuration;
    vec2 flow = vec2(cos(ph), sin(ph)) * 0.7;

    vec2 q = uv * 2.8;
    vec2 w = vec2(fbm(q + flow), fbm(q + flow + vec2(5.2, 1.3)));
    float n = fbm(q + 1.6 * w + 0.5 * flow);

    float shape = smoothstep(0.6, 0.1, length(uv * vec2(0.9, 1.2)));
    float density = smoothstep(0.3, 0.55, n * (0.6 + 0.6 * shape)) * shape;

    vec3 ink = mix(vec3(0.04, 0.035, 0.07), vec3(0.32, 0.22, 0.48), smoothstep(0.5, 0.9, n));
    fragColor = vec4(ink, clamp(density * 0.95, 0.0, 1.0));
}
`},
{
  name: '陽炎（下を歪ませる）', alphaMode: 0, blend: 'replace',
  code: `// 陽炎 — iChannel0 はこのレイヤーより下の合成結果
// 合成を「置き換え」にすると、下のレイヤーが歪んだ状態に置き換わります
// クリッピングしたときは、クリッピング先（とその上）が iChannel0 になります

void mainImage(out vec4 fragColor, in vec2 fragCoord)
{
    vec2 uv = fragCoord / iResolution.xy;
    float ph = 6.2831853 * iTime / iDuration;

    // 上にいくほど強く揺らぐ
    float strength = 0.006 * smoothstep(0.1, 0.9, uv.y);
    vec2 offs = vec2(sin(uv.y * 45.0 - ph * 2.0),
                     cos(uv.x * 30.0 + ph * 3.0)) * strength;

    fragColor = texture(iChannel0, uv + offs);
}
`}
];

const NEW_SHADER_CODE = `// iChannel0 = このレイヤーより下の合成結果

void mainImage(out vec4 fragColor, in vec2 fragCoord)
{
    vec2 uv = (fragCoord - 0.5 * iResolution.xy) / iResolution.y;

/* ---------- 合成モード（クリスタの名称に準拠） ---------- */
const BLEND_GROUPS = [
  [null, [['normal', '通常', 0], ['replace', '置き換え', 26]]],
  ['暗くする', [['darken', '比較（暗）', 1], ['multiply', '乗算', 2], ['colorburn', '焼き込みカラー', 3],
              ['linearburn', '焼き込み（リニア）', 4], ['subtract', '減算', 5]]],
  ['明るくする', [['lighten', '比較（明）', 6], ['screen', 'スクリーン', 7], ['colordodge', '覆い焼きカラー', 8],
                ['glowdodge', '覆い焼き（発光）', 9], ['add', '加算', 10], ['addglow', '加算（発光）', 11]]],
  ['コントラスト', [['overlay', 'オーバーレイ', 12], ['softlight', 'ソフトライト', 13], ['hardlight', 'ハードライト', 14],
                  ['vividlight', 'ビビッドライト', 17], ['linearlight', 'リニアライト', 18], ['pinlight', 'ピンライト', 19],
                  ['hardmix', 'ハードミックス', 20]]],
  ['差', [['difference', '差の絶対値', 15], ['exclusion', '除外', 16], ['divide', '除算', 21]]],
  ['色', [['hue', '色相', 22], ['saturation', '彩度', 23], ['color', 'カラー', 24], ['luminosity', '輝度', 25]]],
];
const BLEND_ID = {}, BLEND_LABEL = {};
for (const [, items] of BLEND_GROUPS) for (const [k, label, id] of items) { BLEND_ID[k] = id; BLEND_LABEL[k] = label; }
(() => {
  const selEl = $('#pBlend');
  for (const [g, items] of BLEND_GROUPS) {
    const parent = g ? Object.assign(document.createElement('optgroup'), { label: g }) : selEl;
    for (const [k, label] of items) parent.appendChild(new Option(label, k));
    if (g) selEl.appendChild(parent);
  }
})();

/* ---------- 加工 ---------- */
const FX_DEFAULT = { key: 'none', colorOn: false, color: '#3a6df0', bright: 0, contrast: 0, hue: 0, sat: 0, light: 0,
  posterize: 0, invert: false, outline: 0, outlineColor: '#ffffff', blur: 0 };
const FX_SLIDERS = [
  ['bright', '明るさ', -100, 100], ['contrast', 'コントラスト', -100, 100], ['hue', '色相', -180, 180],
  ['sat', '彩度', -100, 100], ['light', '明度', -100, 100], ['posterize', '階調化', 0, 32],
  ['outline', 'フチ px', 0, 40], ['blur', 'ぼかし px', 0, 100],
];
const fxColorActive = f => f.key !== 'none' || f.colorOn || f.bright || f.contrast || f.hue || f.sat || f.light || f.invert || f.posterize >= 2;
const fxActive = f => fxColorActive(f) || f.outline > 0 || f.blur > 0;
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);

/* ================================================================
   WebGL setup
   ================================================================ */
const canvas = $('#cv');
const gl = canvas.getContext('webgl2', {
  alpha: true,
  premultipliedAlpha: false,   // straight のまま書き出す
  preserveDrawingBuffer: true, // toBlob で読み出すため
  antialias: false,
});
let hasFloat = false;

const VERT = `#version 300 es
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
const FS_PRE = `#version 300 es
precision highp float;
precision highp int;
`;

// 画像レイヤー（テクスチャは premultiplied。uInv: キャンバスpx(左上原点) → 画像px）
const FS_IMAGE = FS_PRE + `
uniform sampler2D uTex;
uniform mat3 uInv;
uniform vec2 uImg;
uniform float uCanvasH;
out vec4 o;
void main() {
  vec2 q = vec2(gl_FragCoord.x, uCanvasH - gl_FragCoord.y);
  vec2 L = (uInv * vec3(q, 1.0)).xy;
  vec2 fw = max(fwidth(L), vec2(1e-5));
  vec2 dE = min(L, uImg - L) / fw;
  float cov = clamp(min(dE.x, dE.y) + 0.5, 0.0, 1.0);   // 回転時も縁がなめらか
  vec2 uv = vec2(L.x / uImg.x, 1.0 - L.y / uImg.y);
  o = texture(uTex, clamp(uv, 0.0, 1.0)) * cov;
}`;

const FS_COPY = FS_PRE + `
uniform sampler2D uSrc;
out vec4 o;
void main() { o = texelFetch(uSrc, ivec2(gl_FragCoord.xy), 0); }`;

// レイヤー合成（premultiplied）。uClip=1 のときは下地のアルファの内側だけに描く
const FS_COMP = FS_PRE + `
uniform sampler2D uBase, uLayer;
uniform float uOpacity;
uniform int uMode, uClip;
out vec4 o;

float burn(float b, float s)  { return b >= 1.0 ? 1.0 : (s <= 0.0 ? 0.0 : 1.0 - min(1.0, (1.0 - b) / s)); }
float dodge(float b, float s) { return b <= 0.0 ? 0.0 : (s >= 1.0 ? 1.0 : min(1.0, b / (1.0 - s))); }
float softD(float b) { return b <= 0.25 ? ((16.0 * b - 12.0) * b + 4.0) * b : sqrt(b); }
float soft(float b, float s) { return s <= 0.5 ? b - (1.0 - 2.0 * s) * b * (1.0 - b) : b + (2.0 * s - 1.0) * (softD(b) - b); }
float hard(float b, float s) { return s <= 0.5 ? b * 2.0 * s : 1.0 - (1.0 - b) * (1.0 - (2.0 * s - 1.0)); }
float vivid(float b, float s) { return s < 0.5 ? burn(b, 2.0 * s) : dodge(b, 2.0 * s - 1.0); }
float pin(float b, float s) { return s < 0.5 ? min(b, 2.0 * s) : max(b, 2.0 * s - 1.0); }
float divi(float b, float s) { return s <= 0.0 ? (b > 0.0 ? 1.0 : 0.0) : min(1.0, b / s); }
#define PER(f) vec3(f(b.r, s.r), f(b.g, s.g), f(b.b, s.b))

float lum(vec3 c) { return dot(c, vec3(0.3, 0.59, 0.11)); }
vec3 clipColor(vec3 c) {
  float l = lum(c), n = min(min(c.r, c.g), c.b), x = max(max(c.r, c.g), c.b);
  if (n < 0.0) c = l + (c - l) * l / (l - n);
  if (x > 1.0) c = l + (c - l) * (1.0 - l) / (x - l);
  return c;
}
vec3 setLum(vec3 c, float l) { return clipColor(c + (l - lum(c))); }
float satOf(vec3 c) { return max(max(c.r, c.g), c.b) - min(min(c.r, c.g), c.b); }
vec3 setSat(vec3 c, float s) {
  float mx = max(max(c.r, c.g), c.b), mn = min(min(c.r, c.g), c.b);
  return mx > mn ? (c - mn) * s / (mx - mn) : vec3(0.0);
}

vec3 blendF(int m, vec3 b, vec3 s) {
  switch (m) {
    case 1:  return min(b, s);
    case 2:  return b * s;
    case 3:  return PER(burn);
    case 4:  return max(b + s - 1.0, 0.0);
    case 5:  return max(b - s, 0.0);
    case 6:  return max(b, s);
    case 7:  return b + s - b * s;
    case 8:  return PER(dodge);
    case 9:  return PER(dodge);
    case 10: return min(b + s, 1.0);
    case 12: return vec3(hard(s.r, b.r), hard(s.g, b.g), hard(s.b, b.b));
    case 13: return PER(soft);
    case 14: return PER(hard);
    case 15: return abs(b - s);
    case 16: return b + s - 2.0 * b * s;
    case 17: return PER(vivid);
    case 18: return clamp(b + 2.0 * s - 1.0, 0.0, 1.0);
    case 19: return PER(pin);
    case 20: return step(1.0, b + s);
    case 21: return PER(divi);
    case 22: return setLum(setSat(s, satOf(b)), lum(b));
    case 23: return setLum(setSat(b, satOf(s)), lum(b));
    case 24: return setLum(s, lum(b));
    case 25: return setLum(b, lum(s));
    default: return s;
  }
}

void main() {
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec4 B = max(texelFetch(uBase, p, 0), 0.0);
  vec4 L = max(texelFetch(uLayer, p, 0), 0.0);
  B.a = min(B.a, 1.0); L.a = min(L.a, 1.0);
  vec4 S = L * uOpacity;
  float as = S.a, ab = B.a;
  vec3 cs = L.a > 0.0 ? L.rgb / L.a : vec3(0.0);
  vec3 cb = ab > 0.0 ? B.rgb / ab : vec3(0.0);

  if (uClip == 1) {
    if (ab <= 0.0) { o = vec4(0.0); return; }
    vec3 res;
    if (uMode == 0 || uMode == 26) res = mix(cb, cs, as);
    else if (uMode == 11) res = cb + S.rgb;
    else if (uMode == 9) res = min(cb / max(1.0 - min(S.rgb, vec3(1.0)), 0.001), vec3(1.0));
    else res = mix(cb, blendF(uMode, clamp(cb, 0.0, 1.0), clamp(cs, 0.0, 1.0)), as);
    o = vec4(res * ab, ab);
    return;
  }
  if (uMode == 26) { o = mix(B, L, uOpacity); return; }                       // 置き換え
  if (uMode == 0)  { o = S + B * (1.0 - as); return; }                          // 通常
  if (uMode == 11) { o = vec4(S.rgb + B.rgb, min(as + ab, 1.0)); return; }      // 加算（発光）
  if (uMode == 9) {                                                             // 覆い焼き（発光）
    vec3 d = min(B.rgb / max(1.0 - min(S.rgb, vec3(1.0)), 0.001), vec3(1.0));
    o = vec4(d + S.rgb * (1.0 - ab), as + ab - as * ab);
    return;
  }
  vec3 bl = blendF(uMode, clamp(cb, 0.0, 1.0), clamp(cs, 0.0, 1.0));
  o = vec4(S.rgb * (1.0 - ab) + B.rgb * (1.0 - as) + as * ab * bl, as + ab - as * ab);
}`;

// 加工: 抜き・レイヤーカラー・色調補正
const FS_FXCOLOR = FS_PRE + `
uniform sampler2D uSrc;
uniform int uKey, uColorOn, uInvert;
uniform vec3 uColor;
uniform float uBright, uContrast, uHue, uSat, uLight, uPoster;
out vec4 o;
vec3 rgb2hsl(vec3 c) {
  float mx = max(max(c.r, c.g), c.b), mn = min(min(c.r, c.g), c.b);
  float l = (mx + mn) * 0.5, h = 0.0, s = 0.0, d = mx - mn;
  if (d > 1e-6) {
    s = l > 0.5 ? d / (2.0 - mx - mn) : d / (mx + mn);
    if (mx == c.r) h = (c.g - c.b) / d + (c.g < c.b ? 6.0 : 0.0);
    else if (mx == c.g) h = (c.b - c.r) / d + 2.0;
    else h = (c.r - c.g) / d + 4.0;
    h /= 6.0;
  }
  return vec3(h, s, l);
}
vec3 hsl2rgb(vec3 h) {
  vec3 k = clamp(abs(mod(h.x * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
  return h.z + h.y * (k - 0.5) * (1.0 - abs(2.0 * h.z - 1.0));
}
void main() {
  vec4 p = texelFetch(uSrc, ivec2(gl_FragCoord.xy), 0);
  if (p.a <= 0.0) { o = vec4(0.0); return; }
  float a = min(p.a, 1.0);
  vec3 c = p.rgb / p.a;
  if (uKey == 1) {            // 白抜き
    vec3 c1 = clamp(c, 0.0, 1.0);
    float k = max(max(1.0 - c1.r, 1.0 - c1.g), 1.0 - c1.b);
    c = k > 0.0 ? 1.0 - (1.0 - c1) / k : vec3(0.0);
    a *= k;
  } else if (uKey == 2) {     // 黒抜き
    float k = clamp(max(max(c.r, c.g), c.b), 0.0, 1.0);
    c = k > 0.0 ? min(c / k, vec3(1.0)) : vec3(0.0);
    a *= k;
  }
  if (uColorOn == 1) c = uColor;
  c += uBright;
  c = (c - 0.5) * uContrast + 0.5;
  if (uHue != 0.0 || uSat != 0.0 || uLight != 0.0) {
    vec3 h = rgb2hsl(clamp(c, 0.0, 1.0));
    h.x = fract(h.x + uHue / 360.0);
    h.y = clamp(h.y * (1.0 + uSat), 0.0, 1.0);
    h.z = uLight > 0.0 ? mix(h.z, 1.0, uLight) : h.z * (1.0 + uLight);
    c = hsl2rgb(h);
  }
  if (uInvert == 1) c = 1.0 - clamp(c, 0.0, 1.0);
  if (uPoster >= 2.0) c = floor(clamp(c, 0.0, 1.0) * uPoster * 0.9999) / (uPoster - 1.0);
  c = max(c, 0.0);
  o = vec4(c * a, a);
}`;

// 加工: フチ（アルファを膨らませて後ろに色を敷く）
const FS_OUTLINE = FS_PRE + `
uniform sampler2D uSrc;
uniform vec2 uSize;
uniform float uR;
uniform vec3 uCol;
out vec4 o;
void main() {
  vec2 p = gl_FragCoord.xy;
  vec4 s = texelFetch(uSrc, ivec2(p), 0);
  float m = s.a;
  int steps = int(clamp(ceil(uR), 1.0, 16.0));
  for (int k = 1; k <= 16; k++) {
    if (k > steps) break;
    float rr = uR * float(k) / float(steps);
    for (int d = 0; d < 32; d++) {
      float ang = 6.2831853 * (float(d) + 0.5 * float(k & 1)) / 32.0;
      vec2 q = p + vec2(cos(ang), sin(ang)) * rr;
      if (q.x < 0.0 || q.y < 0.0 || q.x > uSize.x || q.y > uSize.y) continue;
      m = max(m, texture(uSrc, q / uSize).a);
    }
  }
  m = min(m, 1.0);
  o = s + vec4(uCol, 1.0) * m * (1.0 - min(s.a, 1.0));
}`;

// 加工: ガウスぼかし（2パス）
const FS_BLUR = FS_PRE + `
uniform sampler2D uSrc;
uniform vec2 uSize, uDir;
uniform float uSigma;
out vec4 o;
void main() {
  float R = ceil(uSigma * 3.0);
  float stp = max(1.0, R / 32.0);
  vec4 acc = vec4(0.0);
  float ws = 0.0;
  for (int i = -32; i <= 32; i++) {
    float x = float(i) * stp;
    if (abs(x) > R) continue;
    vec2 q = gl_FragCoord.xy + uDir * x;
    float w = exp(-x * x / (2.0 * uSigma * uSigma));
    vec4 c = (q.x < 0.0 || q.y < 0.0 || q.x > uSize.x || q.y > uSize.y) ? vec4(0.0) : texture(uSrc, q / uSize);
    acc += c * w;
    ws += w;
  }
  o = acc / ws;
}`;

const FS_UNPREMUL = FS_PRE + `
uniform sampler2D uSrc;
out vec4 o;
void main() {
  vec4 c = texelFetch(uSrc, ivec2(gl_FragCoord.xy), 0);
  o = c.a > 0.0 ? vec4(min(c.rgb / c.a, 1.0), min(c.a, 1.0)) : vec4(0.0);
}`;

const FS_FINAL = FS_PRE + `
uniform sampler2D uSrc;
uniform int uBlack;
out vec4 o;
void main() {
  vec4 c = max(texelFetch(uSrc, ivec2(gl_FragCoord.xy), 0), 0.0);
  c.a = min(c.a, 1.0);
  if (uBlack == 1) o = vec4(min(c.rgb, 1.0), 1.0);
  else o = c.a > 0.0 ? vec4(min(c.rgb / c.a, 1.0), c.a) : vec4(0.0);
}`;

const USER_HEAD = FS_PRE + `uniform vec3  iResolution;
uniform float iTime;
uniform float iTimeDelta;
uniform int   iFrame;
uniform float iFrameRate;
uniform vec4  iMouse;
uniform vec4  iDate;
uniform float iDuration;
uniform sampler2D iChannel0;
uniform vec3  iChannelResolution[4];
uniform int   _alphaMode;
out vec4 _outColor;
#line 1
`;
const USER_TAIL = `
void main() {
  vec4 c = vec4(0.0);
  mainImage(c, gl_FragCoord.xy);
  c = max(c, 0.0);
  c.a = min(c.a, 1.0);
  _outColor = (_alphaMode == 0) ? vec4(c.rgb * c.a, c.a) : c;
}
`;
const USER_UNIFORMS = ['iResolution','iTime','iTimeDelta','iFrame','iFrameRate','iMouse','iDate',
  'iDuration','iChannel0','iChannelResolution','_alphaMode'];


BLEND_LABEL.through = '通過';
const isRaster = l => l && (l.type === 'image' || l.type === 'paint');

let vsObj, vao, P = {};

function buildProgram(fsSrc) {
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, fsSrc);
  gl.compileShader(fs);
  if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(fs) || 'compile error';
    gl.deleteShader(fs);
    return { error: log };
  }
  const p = gl.createProgram();
  gl.attachShader(p, vsObj);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  gl.deleteShader(fs);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(p) || 'link error';
    gl.deleteProgram(p);
    return { error: log };
  }
  return { prog: p };
}
function fixedProgram(src, names) {
  const r = buildProgram(src);
  if (r.error) throw new Error(r.error);
  const u = {};
  for (const n of names) u[n] = gl.getUniformLocation(r.prog, n);
  return { prog: r.prog, u };
}
function initGL() {
  hasFloat = !!gl.getExtension('EXT_color_buffer_float');
  vsObj = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vsObj, VERT);
  gl.compileShader(vsObj);
  vao = gl.createVertexArray();
  P.image = fixedProgram(FS_IMAGE, ['uTex', 'uInv', 'uImg', 'uCanvasH']);
  P.copy = fixedProgram(FS_COPY, ['uSrc']);
  P.comp = fixedProgram(FS_COMP, ['uBase', 'uLayer', 'uOpacity', 'uMode', 'uClip']);
  P.fxc = fixedProgram(FS_FXCOLOR, ['uSrc', 'uKey', 'uColorOn', 'uInvert', 'uColor', 'uBright', 'uContrast', 'uHue', 'uSat', 'uLight', 'uPoster']);
  P.outline = fixedProgram(FS_OUTLINE, ['uSrc', 'uSize', 'uR', 'uCol']);
  P.blur = fixedProgram(FS_BLUR, ['uSrc', 'uSize', 'uDir', 'uSigma']);
  P.unpremul = fixedProgram(FS_UNPREMUL, ['uSrc']);
  P.final = fixedProgram(FS_FINAL, ['uSrc', 'uBlack']);
  gl.disable(gl.BLEND);
  gl.disable(gl.DEPTH_TEST);
}

/* ---------- render target pool ---------- */
let pool = { w: 0, h: 0, free: [], all: [] }, chT = null;
function makeTarget(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if (hasFloat) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.bindTexture(gl.TEXTURE_2D, null);
  return { tex, fb, ok };
}
function ensurePool(w, h) {
  if (pool.w === w && pool.h === h && pool.all.length) return;
  for (const t of pool.all) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); }
  pool = { w, h, free: [], all: [] };
  chT = null;
  let t = makeTarget(w, h);
  if (!t.ok && hasFloat) {      // float に描けない環境は 8bit に切り替え
    gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb);
    hasFloat = false;
    t = makeTarget(w, h);
  }
  pool.all.push(t); pool.free.push(t);
}
function acquire() {
  let t = pool.free.pop();
  if (!t) { t = makeTarget(pool.w, pool.h); pool.all.push(t); }
  return t;
}
const release = t => { if (t) pool.free.push(t); };
function acquireCleared() { const t = acquire(); clearTarget(t); return t; }
const chTarget = () => (chT ||= acquire());

function bindTex(unit, tex) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); }
function unbindAll() { bindTex(1, null); bindTex(0, null); }
function drawTo(fb) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.bindVertexArray(vao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function clearTarget(t) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
}

/* ================================================================
   Layer tree（配列の index 0 が一番下。フォルダは children を持つ）
   ================================================================ */
let root = [];
let selId = null;
let idCounter = 0;
const newId = () => 'L' + Date.now().toString(36) + (idCounter++).toString(36);

function* walk(list = root, parent = null, depth = 0) {
  for (const n of list) {
    yield { n, list, parent, depth };
    if (n.type === 'folder') yield* walk(n.children, n, depth + 1);
  }
}
const allNodes = () => [...walk()].map(x => x.n);
function byId(id) { for (const { n } of walk()) if (n.id === id) return n; return null; }
function locate(node) { for (const x of walk()) if (x.n === node) return { ...x, index: x.list.indexOf(node) }; return null; }
const sel = () => (selId ? byId(selId) : null);
function contains(folder, node) {
  if (folder.type !== 'folder') return false;
  for (const { n } of walk(folder.children)) if (n === node) return true;
  return false;
}

function common(opts, folder) {
  const okBlend = BLEND_ID[opts.blend] !== undefined || (folder && opts.blend === 'through');
  return {
    id: opts.id || newId(), visible: opts.visible ?? true, opacity: opts.opacity ?? 1,
    blend: okBlend ? opts.blend : (folder ? 'through' : 'normal'), clip: !!opts.clip,
    fx: { ...FX_DEFAULT, ...(opts.fx || {}) },
  };
}
function makeShaderLayer(opts = {}) {
  const n = allNodes().filter(l => l.type === 'shader').length + 1;
  return {
    ...common(opts), type: 'shader', name: opts.name || `GLSL ${n}`,
    code: opts.code ?? NEW_SHADER_CODE, alphaMode: opts.alphaMode ?? 0,
    prog: null, U: {}, error: null, errorLines: new Set(),
  };
}
const rasterProps = opts => ({
  cx: opts.cx ?? 0, cy: opts.cy ?? 0, sx: opts.sx ?? 1, sy: opts.sy ?? 1, rot: opts.rot ?? 0,
  flipH: !!opts.flipH, flipV: !!opts.flipV, interp: opts.interp || 'smooth', tex: null,
});
function makeImageLayer(opts) {
  return { ...common(opts), ...rasterProps(opts), type: 'image', name: opts.name || '画像',
    blob: opts.blob, url: null, iw: 1, ih: 1 };
}
function makePaintLayer(opts) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, opts.pw | 0);
  c.height = Math.max(1, opts.ph | 0);
  const n = allNodes().filter(l => l.type === 'paint').length + 1;
  return { ...common(opts), ...rasterProps(opts), type: 'paint', name: opts.name || `描画 ${n}`,
    canvas: c, iw: c.width, ih: c.height, texDirty: true,
    cx: opts.cx ?? c.width / 2, cy: opts.cy ?? c.height / 2 };
}
function makeFolder(opts = {}) {
  const n = allNodes().filter(l => l.type === 'folder').length + 1;
  return { ...common(opts, true), type: 'folder', name: opts.name || `フォルダ ${n}`,
    open: opts.open ?? true, children: [] };
}
const layerReady = l => l.type === 'image' ? !!l.tex : l.type === 'shader' ? !!l.prog : true;
const nodeShown = n => n.visible && n.opacity > 0 && layerReady(n);

function insertNode(n) {
  checkpoint();
  const cur = sel();
  const loc = cur ? locate(cur) : null;
  if (loc) loc.list.splice(loc.index + 1, 0, n);
  else root.push(n);
  selectLayer(n.id);
  dirty = true;
  scheduleSave();
}
function removeNode(n) {
  const loc = locate(n);
  if (!loc) return;
  checkpoint();
  loc.list.splice(loc.index, 1);
  const next = loc.list[Math.min(loc.index, loc.list.length - 1)] || loc.list[loc.index - 1] || loc.parent || null;
  selectLayer(next ? next.id : null);
  dirty = true;
  scheduleSave();
}
function cloneCanvas(src) {
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  c.getContext('2d').drawImage(src, 0, 0);
  return c;
}
async function cloneNode(l, top) {
  const { id, children, tex, prog, U, url, canvas: cv, ...rest } = l;
  const name = top ? l.name + ' コピー' : l.name;
  if (l.type === 'shader') { const c = makeShaderLayer({ ...rest, name }); compileLayer(c); return c; }
  if (l.type === 'image') {
    const c = makeImageLayer({ ...rest, name });
    await loadImageLayer(c);
    idb.put(c.id, c.blob).catch(() => {});
    return c;
  }
  if (l.type === 'paint') {
    const c = makePaintLayer({ ...rest, name, pw: cv.width, ph: cv.height });
    c.canvas.getContext('2d').drawImage(cv, 0, 0);
    schedulePaintSave(c);
    return c;
  }
  const f = makeFolder({ ...rest, name });
  for (const ch of children) f.children.push(await cloneNode(ch, false));
  return f;
}
async function duplicateNode(l) { if (l) insertNode(await cloneNode(l, true)); }

function moveNode(dragId, targetId, where) {
  const d = byId(dragId), t = byId(targetId);
  if (!d || !t || d === t || contains(d, t)) return;
  checkpoint();
  const from = locate(d);
  from.list.splice(from.index, 1);
  if (where === 'into') { t.children.push(d); t.open = true; }
  else {
    const to = locate(t);
    to.list.splice(where === 'above' ? to.index + 1 : to.index, 0, d);
  }
  renderLayerList();
  dirty = true;
  scheduleSave();
}
function toggleClip() {
  const l = sel();
  if (!l) return;
  checkpoint();
  l.clip = !l.clip;
  propChanged();
}
function groupSelected() {
  const l = sel();
  const f = makeFolder();
  checkpoint();
  if (l) {
    const loc = locate(l);
    loc.list.splice(loc.index, 1, f);
    f.children.push(l);
    if (l.clip) l.clip = false;
  } else root.push(f);
  selectLayer(f.id);
  dirty = true;
  scheduleSave();
}

/* ---------- raster layers ---------- */
function applyInterp(l) {
  if (!l.tex) return;
  gl.bindTexture(gl.TEXTURE_2D, l.tex);
  const near = l.interp === 'nearest';
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, near ? gl.NEAREST : gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, near ? gl.NEAREST : gl.LINEAR);
}
function uploadTexture(l, src) {
  if (!l.tex) l.tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, l.tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  applyInterp(l);
}
async function loadImageLayer(l) {
  const url = URL.createObjectURL(l.blob);
  const img = new Image();
  img.src = url;
  await img.decode();
  l.iw = img.naturalWidth;
  l.ih = img.naturalHeight;
  let src = img;
  const max = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  if (l.iw > max || l.ih > max) {
    const k = max / Math.max(l.iw, l.ih);
    const c = document.createElement('canvas');
    c.width = Math.floor(l.iw * k); c.height = Math.floor(l.ih * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    src = c;
  }
  uploadTexture(l, src);
  l.url = url;
}
async function addImageFiles(files) {
  const imgs = [...files].filter(f => f.type.startsWith('image/'));
  const s = S();
  for (const f of imgs) {
    const l = makeImageLayer({ name: f.name || '貼り付け画像', blob: f });
    try { await loadImageLayer(l); }
    catch (e) { setStatus(`${f.name} を読み込めませんでした`); continue; }
    const k = Math.min(1, s.w / l.iw, s.h / l.ih);   // キャンバスより大きければ収める
    Object.assign(l, { cx: s.w / 2, cy: s.h / 2, sx: k, sy: k });
    insertNode(l);
    idb.put(l.id, f).catch(() => {});
  }
}
function addPaintLayer() {
  const s = S();
  const l = makePaintLayer({ pw: s.w, ph: s.h, cx: s.w / 2, cy: s.h / 2 });
  insertNode(l);
  return l;
}
const paintTimers = new Map();
function schedulePaintSave(l) {
  clearTimeout(paintTimers.get(l.id));
  paintTimers.set(l.id, setTimeout(() => {
    l.canvas.toBlob(b => { if (b) idb.put(l.id, b).catch(() => {}); }, 'image/png');
  }, 700));
}
const canvasToBlob = c => new Promise(res => c.toBlob(res, 'image/png'));

/* ---------- transform math（出力px・左上原点・y下向き） ---------- */
function tf(l) {
  const t = l.rot * Math.PI / 180;
  return { c: Math.cos(t), s: Math.sin(t), ssx: l.sx * (l.flipH ? -1 : 1), ssy: l.sy * (l.flipV ? -1 : 1) };
}
function localToOut(l, Lx, Ly) {
  const { c, s, ssx, ssy } = tf(l);
  const x = (Lx - l.iw / 2) * ssx, y = (Ly - l.ih / 2) * ssy;
  return [l.cx + c * x - s * y, l.cy + s * x + c * y];
}
function outToLocal(l, ox, oy) {
  const { c, s, ssx, ssy } = tf(l);
  const vx = ox - l.cx, vy = oy - l.cy;
  return [l.iw / 2 + (c * vx + s * vy) / ssx, l.ih / 2 + (-s * vx + c * vy) / ssy];
}
function imageInvMatrix(l, ps) {
  const { c, s, ssx, ssy } = tf(l);
  return new Float32Array([
    c / (ps * ssx), -s / (ps * ssy), 0,
    s / (ps * ssx), c / (ps * ssy), 0,
    l.iw / 2 - (c * l.cx + s * l.cy) / ssx, l.ih / 2 - (-s * l.cx + c * l.cy) / ssy, 1,
  ]);
}

/* ---------- shader layers ---------- */
function compileLayer(l) {
  const src = l.code.replace(/^[ \t]*#version.*$/gm, '');
  const userLines = src.split('\n').length;
  const r = buildProgram(USER_HEAD + src + USER_TAIL);
  if (r.error) {
    const { text, lines } = parseErrors(r.error, userLines);
    l.error = text;
    l.errorLines = lines;
  } else {
    if (l.prog) gl.deleteProgram(l.prog);
    l.prog = r.prog;
    l.U = {};
    for (const n of USER_UNIFORMS) l.U[n] = gl.getUniformLocation(r.prog, n);
    l.error = null;
    l.errorLines = new Set();
  }
  if (l.id === selId) { updateGutter(); showLayerLog(); }
  renderLayerList();
  dirty = true;
  return !l.error;
}
function parseErrors(info, userLines) {
  const lines = new Set(), out = [];
  for (const raw of info.split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    const m = line.match(/^(?:ERROR|WARNING):\s*\d+:(\d+):\s*(.*)$/);
    if (m) {
      const ln = +m[1];
      if (ln >= 1 && ln <= userLines) { lines.add(ln); out.push(`${ln}行目: ${m[2]}`); }
      else out.push(`(末尾) ${m[2]}　← mainImage が無い・括弧の閉じ忘れなど`);
    } else out.push(line);
  }
  return { text: out.join('\n'), lines };
}

/* ================================================================
   Undo / Redo（構成・プロパティ・変形・加工・描画。コード編集はエディタ側の取り消し）
   ================================================================ */
const PROP_KEYS = ['name','visible','opacity','blend','clip','alphaMode','cx','cy','sx','sy','rot','flipH','flipV','interp','open','canvas'];
const hist = { undo: [], redo: [], key: null, time: 0 };
function snapNode(n) {
  const p = {};
  for (const k of PROP_KEYS) if (k in n) p[k] = n[k];
  p.fx = { ...n.fx };
  return { n, p, kids: n.type === 'folder' ? n.children.map(snapNode) : null };
}
const snapshot = () => ({ selId, items: root.map(snapNode) });
function checkpoint(key) {
  if (booting) return;
  const now = performance.now();
  if (key && key === hist.key && now - hist.time < 1200) { hist.time = now; return; }
  hist.undo.push(snapshot());
  if (hist.undo.length > 60) hist.undo.shift();
  hist.redo = [];
  hist.key = key || null;
  hist.time = now;
  updateUndoButtons();
}
function restNode(s) {
  const n = s.n;
  const oldCanvas = n.canvas;
  Object.assign(n, s.p, { fx: { ...s.p.fx } });
  if (s.kids) n.children = s.kids.map(restNode);
  if (n.type === 'paint' && n.canvas !== oldCanvas) { n.texDirty = true; schedulePaintSave(n); }
  if (n.type === 'image') applyInterp(n);
  return n;
}
function restoreSnapshot(snap) {
  root = snap.items.map(restNode);
  selectLayer(byId(snap.selId) ? snap.selId : (root.at(-1)?.id ?? null));
  dirty = true;
  scheduleSave();
}
function undo() {
  if (!hist.undo.length) return;
  hist.redo.push(snapshot());
  restoreSnapshot(hist.undo.pop());
  hist.key = null;
  updateUndoButtons();
}
function redo() {
  if (!hist.redo.length) return;
  hist.undo.push(snapshot());
  restoreSnapshot(hist.redo.pop());
  hist.key = null;
  updateUndoButtons();
}
function updateUndoButtons() {
  $('#undoBtn').disabled = !hist.undo.length;
  $('#redoBtn').disabled = !hist.redo.length;
}
$('#undoBtn').addEventListener('click', undo);
$('#redoBtn').addEventListener('click', redo);

/* ================================================================
   Layer panel UI
   ================================================================ */
const EYE_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M10.6 5.1A10.6 10.6 0 0 1 12 5c7 0 11 7 11 7a18 18 0 0 1-3.2 4M6.6 6.6C3 8.6 1 12 1 12s4 7 11 7a10 10 0 0 0 5.4-1.6"/></svg>';
const FOLDER_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" opacity=".9"/></svg>';

function renderLayerList() {
  const ul = $('#layerList');
  ul.innerHTML = '';
  if (!root.length) {
    ul.innerHTML = '<li class="empty">レイヤーがありません。<br>＋GLSL／＋画像／＋描画 で追加できます。<br>画像はプレビューへのドロップや<br>Ctrl/⌘+V の貼り付けでも追加できます。</li>';
    return;
  }
  const addRows = (list, depth, parentHidden) => {
    for (let i = list.length - 1; i >= 0; i--) {
      const l = list[i];
      ul.appendChild(layerRow(l, depth, parentHidden, i > 0 && l.clip));
      if (l.type === 'folder' && l.open) addRows(l.children, depth + 1, parentHidden || !l.visible);
    }
  };
  addRows(root, 0, false);
}

function layerRow(l, depth, parentHidden, clipped) {

  if (clipped) li.classList.add('clip');

  if (l.type === 'folder') {
    const caret = document.createElement('button');
    caret.className = 'caret';
    caret.textContent = l.open ? '▾' : '▸';
    caret.title = l.open ? '閉じる' : '開く';
    caret.addEventListener('click', e => { e.stopPropagation(); l.open = !l.open; renderLayerList(); scheduleSave(); });
    li.appendChild(caret);
  }
  const eye = document.createElement('button');
  eye.className = 'eye';
  eye.title = '表示／非表示';
  eye.innerHTML = l.visible ? EYE_ON : EYE_OFF;
  eye.addEventListener('click', e => {
    e.stopPropagation();
    checkpoint();
    l.visible = !l.visible;
    renderLayerList();
    dirty = true;
    scheduleSave();
  });

  const thumb = document.createElement('div');
  if (l.type === 'image') {
    thumb.className = 'thumb';
    const im = document.createElement('img');
    im.src = l.url;
    im.draggable = false;
    thumb.appendChild(im);
  } else if (l.type === 'paint') {
    thumb.className = 'thumb';
    const c = document.createElement('canvas');
    c.width = 76; c.height = 52;
    const k = Math.min(76 / l.canvas.width, 52 / l.canvas.height);
    c.getContext('2d').drawImage(l.canvas, (76 - l.canvas.width * k) / 2, (52 - l.canvas.height * k) / 2, l.canvas.width * k, l.canvas.height * k);
    thumb.appendChild(c);
  } else if (l.type === 'folder') {
    thumb.className = 'thumb folder';
    thumb.innerHTML = FOLDER_ICON;
  } else {
    thumb.className = 'thumb glsl';
    thumb.textContent = 'GLSL';
  }

  const nameBox = document.createElement('div');
  nameBox.style.cssText = 'flex:1;min-width:0';
  const name = document.createElement('div');
  name.className = 'lname';
  name.textContent = l.name;
  name.title = 'ダブルクリックで名前を変更';
  const meta = document.createElement('div');
  meta.className = 'lmeta';
  const bits = [];
  const defBlend = l.type === 'folder' ? 'through' : 'normal';
  if (l.blend !== defBlend) bits.push(BLEND_LABEL[l.blend]);
  if (l.opacity < 1) bits.push(Math.round(l.opacity * 100) + '%');
  if (fxActive(l.fx)) bits.push('加工');
  if (l.type === 'folder') bits.push(`${l.children.length}`);
  meta.textContent = bits.join(' · ');
  nameBox.append(name, meta);

  li.append(eye, thumb, nameBox);
  if (l.type === 'shader' && l.error) {
    const d = document.createElement('span');
    d.className = 'errdot';
    d.title = 'コンパイルエラー';
    li.appendChild(d);
  }

  li.addEventListener('click', () => selectLayer(l.id));
  li.addEventListener('dblclick', e => {
    if (e.target.closest('.caret,.eye')) return;
    const n = prompt('レイヤー名', l.name);
    if (n && n.trim()) { checkpoint(); l.name = n.trim(); renderLayerList(); updateEditingLabel(); scheduleSave(); }
  });
  li.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/x-layer', l.id);
    e.dataTransfer.effectAllowed = 'move';
  });
  const zone = e => {
    const r = li.getBoundingClientRect();
    const y = (e.clientY - r.top) / r.height;
    if (l.type === 'folder') return y < 0.28 ? 'above' : y > 0.72 ? 'below' : 'into';
    return y < 0.5 ? 'above' : 'below';
  };
  li.addEventListener('dragover', e => {
    if (!e.dataTransfer.types.includes('text/x-layer')) return;
    e.preventDefault();
    const z = zone(e);
    li.classList.toggle('drop-above', z === 'above');
    li.classList.toggle('drop-below', z === 'below');
    li.classList.toggle('drop-into', z === 'into');
  });
  li.addEventListener('dragleave', () => li.classList.remove('drop-above', 'drop-below', 'drop-into'));
  li.addEventListener('drop', e => {
    const id = e.dataTransfer.getData('text/x-layer');
    if (!id) return;
    e.preventDefault();
    e.stopPropagation();
    const z = zone(e);
    li.classList.remove('drop-above', 'drop-below', 'drop-into');
    moveNode(id, l.id, z);
  });
  return li;
}
